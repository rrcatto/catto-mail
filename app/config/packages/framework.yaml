# Configuration is read only from the variables in docs/contracts/environment.md.
# Secrets go through the `secret:` env processor (App\Config\SecretEnvVarProcessor),
# which implements the contract's X / X_FILE indirection.
framework:
    secret: '%env(secret:APP_SECRET)%'
    http_method_override: false
    handle_all_throwables: true
    # nginx talks FastCGI directly to PHP-FPM, so REMOTE_ADDR is already the client address.
    # The trusted range is still the internal network (contract TRUSTED_PROXIES).
    trusted_proxies: '%env(TRUSTED_PROXIES)%'
    trusted_headers: ['x-forwarded-for', 'x-forwarded-proto']
    # Sessions exist only for the dashboard firewall; the /v1 API is stateless.
    session:
        cookie_secure: auto
        cookie_samesite: lax
    php_errors:
        log: true
    rate_limiter:
        # Per API key (contract APP_API_RATE_LIMIT_PER_MINUTE).
        api_key:
            policy: sliding_window
            limit: '%env(int:APP_API_RATE_LIMIT_PER_MINUTE)%'
            interval: '1 minute'
        # Per client IP for failed API authentication (credential guessing).
        api_auth_failure:
            policy: sliding_window
            limit: 30
            interval: '1 minute'
        # Per client IP for the public tracking endpoints (Phase 6). Generous, because
        # mailbox providers fetch images through a few proxy addresses: above it the
        # pixel and redirects are still served, only the database write is skipped.
        tracking:
            policy: sliding_window
            limit: 1200
            interval: '1 minute'
        # Public sign-up (owner decision 2026-10-11): every submission of the form per client IP
        # (also the invalid ones and the honeypot's catches); the verification page and its
        # confirmation per client IP, and the confirmation per address. Links per address:
        # App\Security\LoginLinkService::SIGN_UP_MAX_PER_EMAIL.
        public_sign_up:
            policy: sliding_window
            limit: 10
            interval: '1 hour'
        public_sign_up_verify:
            policy: sliding_window
            limit: 20
            interval: '1 hour'
        public_sign_up_address:
            policy: sliding_window
            limit: 5
            interval: '1 hour'
        # Application connect (specification 2.12), per client IP: the connect page and its
        # answer (each look resolves the webhook host), and the code exchange of an application.
        connect_page:
            policy: sliding_window
            limit: 120
            interval: '1 hour'
        connect_exchange:
            policy: sliding_window
            limit: 30
            interval: '1 minute'

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
