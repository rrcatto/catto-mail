# Two authentication worlds that never mix (D-12, spec api.authentication):
#   * /v1        - machine clients, `Authorization: Bearer <api key>`, stateless;
#   * /dashboard - human users, passwordless: a single-use link emailed to the
#                  user's address (App\Security\LoginLinkService) starts a session.
# An API key is never accepted by the dashboard firewall, and a dashboard session is
# never accepted by the API firewall. There are no passwords.
#
# Authorisation in the dashboard uses permission keys (App\Access\PermissionCatalog,
# granted by roles; App\Access\PermissionVoter) and, for a client's own data, client
# memberships (App\Security\ClientVoter). There is no role hierarchy: each operator
# page states the permission it needs with #[IsGranted].
security:
    providers:
        api_keys:
            id: App\Security\ApiKeyUserProvider
        dashboard_users:
            id: App\Security\DashboardUserProvider

    firewalls:
        api:
            pattern: ^/v1(/|$)
            stateless: true
            provider: api_keys
            custom_authenticators:
                - App\Security\ApiKeyAuthenticator
            entry_point: App\Security\ApiKeyAuthenticator
        dashboard:
            pattern: ^/dashboard(/|$)
            lazy: true
            provider: dashboard_users
            user_checker: App\Security\DashboardUserChecker
            custom_authenticators:
                - App\Security\LoginLinkAuthenticator
            entry_point: App\Security\LoginLinkAuthenticator
            logout:
                path: dashboard_logout
                target: dashboard_login
                enable_csrf: true
                csrf_parameter: _csrf_token
                csrf_token_id: logout
        # Everything else, including the public tracking endpoints /t/o and /t/c and
        # the AssetMapper assets: no authentication, no session, no cookies.
        main:
            security: false

    access_control:
        - { path: '^/dashboard/login(/sent|/verify)?$', roles: PUBLIC_ACCESS }
        - { path: ^/dashboard, roles: ROLE_USER }
        - { path: ^/v1(/|$), roles: ROLE_API_CLIENT }
