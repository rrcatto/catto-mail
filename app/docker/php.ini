; Smarthost PHP runtime settings.
date.timezone = UTC
expose_php = Off
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2
; The API body limit is APP_API_MAX_REQUEST_BYTES (10 MiB, enforced by the
; application with a problem+json 413). PHP must accept slightly more so the
; application, not PHP, makes that decision.
post_max_size = 12M
upload_max_filesize = 2M
memory_limit = 512M
max_execution_time = 120
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 1
realpath_cache_size = 4096K
