openapi: 3.1.0
info:
  title: Smarthost API
  version: 1.0.0-draft.11
  summary: Email validation and tracked delivery API (specification 2.13 contract).
  description: |
    Public Smarthost API contract. Normative elaboration of
    `docs/20260908-1644-smarthost-llm-spec.yaml` (specification 2.13), which wins on
    any conflict. A client-facing integration guide is `docs/api/integration-guide.md`
    (served by an installation at `/docs/api`). Status and event values are defined in
    `docs/contracts/status-vocabulary.yaml`.

    ## Conventions
    * The client (tenant) is always derived from the API key. No request carries
      or overrides a `client_id`. Resources owned by another client return `404`.
      One operation takes no API key: `POST /connect/exchange`, with which an
      application that is being connected collects its key (see *Connecting an
      application*).
    * Only `active` and `throttled` clients may create or add work. The
      work-creating operations (create validation job, create send job, add
      recipients, submit) return `403` for `pending_approval` and `suspended`
      clients, which can still read their resources. Keys of `closed` clients
      fail authentication (`401`).
    * Identifiers are UUIDv7 strings. Timestamps are RFC 3339 in the installation's
      time zone, with its offset (`SMARTHOST_TIMEZONE`, Africa/Johannesburg by default:
      `2026-10-10T10:48:56.123456+02:00`). Requests may give any offset.
    * JSON field names are `snake_case`. Errors use RFC 9457
      `application/problem+json`.
    * Request bodies are limited to 10 MiB (`413` above it). Collections use
      cursor (keyset) pagination: `limit` and an opaque `cursor`.
    * API keys may expire; an expired key fails exactly like a revoked one (`401`).
    * Rate limits and quotas (specification 2.10). Requests are limited per API key
      and per client (all of its keys together); a `throttled` client has a lower
      request rate. Over a rate limit: `429` with problem type `rate-limited` and
      `Retry-After`. Work is also admitted against the client's quotas per calendar day
      or month in the installation's time zone (`SMARTHOST_TIMEZONE`, Africa/Johannesburg
      by default) (validation jobs, validation addresses, send jobs, recipients): a request
      that would exceed one is refused before any work is created, with `429`,
      problem type `quota-exceeded`, `Retry-After` until the period resets, and a
      `quota` member naming the metric, period, limit, amount used, amount requested
      and reset time. Idempotent replays never count again. A per-client limit on
      recipients per send job may be lower than the contract ceiling of 10000; above
      it a batch is refused with `422` `recipient-limit-exceeded`.

    ## Connecting an application (specification 2.12)
    An application can be connected with one approval instead of a copied API key
    and webhook secret: an authorisation-code flow with PKCE (RFC 7636, `S256`).

    1. The application creates a random `state` and a code verifier (43 to 128
       characters of `A-Z a-z 0-9 - . _ ~`), keeps both, and sends the person's
       browser to the connect page of the installation, which is not part of `/v1`:

       `GET https://<host>/dashboard/connect?application_name=…&redirect_uri=…&webhook_url=…&state=…&code_challenge=…&code_challenge_method=S256`

       | Parameter | Value |
       |---|---|
       | `application_name` | 1 to 100 characters; shown to the person and used as the name of the API key. |
       | `redirect_uri` | Absolute `https` URL of the application (at most 2000 characters, no credentials, no fragment): where the person is sent back to. |
       | `webhook_url` | Absolute `https` URL (at most 2000 characters) that receives the application's webhooks. It must resolve to public addresses, like every webhook endpoint. |
       | `state` | 1 to 512 printable ASCII characters without spaces; returned unchanged. |
       | `code_challenge` | `BASE64URL(SHA-256(code verifier))` without padding (43 characters). |
       | `code_challenge_method` | `S256`. |
       | `sending_domain` | Optional (specification 2.13): the domain the application sends from, the part after `@` of its From address. Approving adds it to the chosen account when the account does not have it yet and has room for it, so the person can go straight on to its DNS steps (`setup_url` of `GET /sending-domains`). |

       Plain `http` URLs are accepted only by a development installation. A request
       that is incomplete or refused is explained on the page; the person is never
       redirected to a URL that was not accepted.
    2. The person signs in (or, where the installation offers public sign-up, opens
       an account there and then; signed in without an account, they may open one
       on the page with the organisation's name where the installation allows it),
       chooses one of their accounts and approves. Only an admin of the account can
       approve, and only for an `active` account with room under its limits on
       usable API keys and webhook endpoints.
    3. The person is sent back with `303 See Other` to
       `redirect_uri?code=<code>&state=<state>`, or, after declining, to
       `redirect_uri?error=access_denied&error_description=…&state=<state>`. The
       code works once and expires 10 minutes after the approval. No key or secret
       is ever in a redirect.
    4. The application checks `state` and exchanges the code, server to server, with
       `POST /connect/exchange`. The answer carries the API key and the webhook
       signing secret, once. The key (named after the application) and the webhook
       endpoint are created by that exchange, subscribed to `validation.completed`,
       `validation.failed`, `send.completed`, `send.failed`, `message.hard_bounced`
       and `message.complained`. An earlier connection of the same client to the
       same `webhook_url` is ended at the same moment (its key revoked, its endpoint
       removed), so connecting again replaces it.
    5. The application ends its own connection with `DELETE /connection`; a client
       admin can end it in the dashboard (Settings › Connected applications). Either
       way the key is revoked and the endpoint removed.

    Connecting never grants the global-opt-out capability: only an operator does.

    ## Send-job lifecycle (staged recipient upload)
    1. `POST /send-jobs` creates the job in `collecting` state with job-level
       metadata only.
    2. `POST /send-jobs/{id}/recipients` adds up to 500 fully rendered recipients
       per request (idempotent per batch). The job total may not exceed the
       configured limit (default and ceiling 10000), and duplicate addresses are
       rejected within and across batches. Recipients can only be added while
       the job is `collecting`.
    3. `POST /send-jobs/{id}/submit` atomically seals the recipient set and moves
       the job to `queued`.

    The job then moves through `processing` and `dispatched` (all recipients
    handed to Postfix, suppressed or immediately failed) to `completed` (every
    message has a terminal knowledge state, which can take days).

    ## Content boundary
    Smarthost performs no mail merge, template rendering or variable
    substitution. The client submits a rendered subject and HTML and/or plain
    text per recipient. Arbitrary MIME headers are not accepted. When enabled
    per job, Smarthost inserts an open pixel into HTML parts and rewrites
    eligible HTTP/HTTPS links in HTML parts for click tracking. It never
    rewrites plain-text, `mailto:`, fragment-only, non-HTTP(S) or unsubscribe
    URLs.

    ## Delivery semantics
    `remote_accepted` means the receiving SMTP system accepted responsibility for
    the message. It does not prove inbox placement, receipt or reading.
    `outcome_unknown` means Smarthost cannot determine the final SMTP result. It
    is not a success state. `open_recorded` is a recorded open, not a proven
    read.

    ## Global suppression (D-30)
    Smarthost suppresses an address globally, for every client of the
    installation, after a recipient-specific hard bounce, a correlated
    complaint or repeated recipient soft bounces. A suppressed recipient gets a
    message with `current_status` `suppressed` and is never submitted.

    An ordinary list, newsletter, campaign or client unsubscribe stays in the
    client application and is never sent to Smarthost. Only when a recipient
    explicitly asks not to receive email from any source using this Smarthost
    installation may a client that an operator has granted the global-opt-out
    capability report it with `POST /global-suppressions`; it can later report
    the withdrawal with `POST /global-suppressions/{id}/lift`. Lifting removes
    only that opt-out: the address stays suppressed while any other suppression
    (for example a hard bounce, or another client's opt-out) is active.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: https://smarthost.example.com/v1
    description: Placeholder; the real host comes from SMARTHOST_PUBLIC_BASE_URL.
security:
  - apiKey: []
tags:
  - name: Validation
    description: Asynchronous evidence-based email-address validation jobs.
  - name: Sending
    description: Tracked send jobs executed by the Go delivery service through Postfix.
  - name: Messages
    description: Per-recipient message state and append-only event history.
  - name: Webhooks
    description: Signed event notifications to the client's registered endpoints.
  - name: Suppressions
    description: >-
      Recipient global opt-outs reported by trusted clients (D-30). Requires the
      operator-granted global-opt-out capability.
  - name: Blocks
    description: >-
      The account's own blocks (specification 2.13, owner decision 2026-10-27): an
      address or a whole domain the account never sends to. A block stops this
      account's mail only; it never affects other accounts.
  - name: Connect
    description: >-
      Connecting an application with one approval (specification 2.12): the code
      exchange and the application's own disconnection.
  - name: Sending domains
    description: The client's sending domains and whether they can send (read-only).

paths:
  /validation-jobs:
    post:
      tags: [Validation]
      operationId: createValidationJob
      summary: Create an asynchronous validation job (max 10000 addresses).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ValidationJobCreateRequest'}
      responses:
        '202':
          description: Job accepted (or idempotent replay of an earlier identical request).
          headers:
            Location: {$ref: '#/components/headers/Location'}
            Idempotent-Replayed: {$ref: '#/components/headers/IdempotentReplayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ValidationJob'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/IdempotencyInProgress'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /validation-jobs/{id}:
    get:
      tags: [Validation]
      operationId: getValidationJob
      summary: Retrieve validation job state and summary.
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Job state.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ValidationJob'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /validation-jobs/{id}/addresses:
    get:
      tags: [Validation]
      operationId: listValidationAddresses
      summary: Paginated per-address validation results.
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: overall_classification
          in: query
          required: false
          description: Filter by overall classification.
          schema: {$ref: '#/components/schemas/OverallClassification'}
      responses:
        '200':
          description: One page of results, ordered by address id ascending (submission order).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ValidationAddressPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /send-jobs:
    post:
      tags: [Sending]
      operationId: createSendJob
      summary: Create a send job in `collecting` state (job-level metadata only).
      description: >-
        The sender identity's domain must be a registered sending domain of the
        client. Verification (and, in production, active DKIM) is enforced at
        submit.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SendJobCreateRequest'}
      responses:
        '201':
          description: Job created in `collecting` state (or idempotent replay).
          headers:
            Location: {$ref: '#/components/headers/Location'}
            Idempotent-Replayed: {$ref: '#/components/headers/IdempotentReplayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SendJob'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/IdempotencyInProgress'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /send-jobs/{id}/recipients:
    post:
      tags: [Sending]
      operationId: addSendJobRecipients
      summary: Add a batch of up to 500 fully rendered recipients to a collecting job.
      description: >-
        The batch is accepted or rejected as a whole. It is rejected with 422 if
        the job total would exceed the configured maximum, if any address
        duplicates another in this batch or an earlier batch (after D-18
        normalisation), or if class rules are violated: `subscription` jobs
        require `unsubscribe_url` on every recipient, and `transactional` jobs
        do not accept it. Returns 409 when the job is no longer `collecting`.
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RecipientBatchRequest'}
      responses:
        '201':
          description: Batch accepted (or idempotent replay).
          headers:
            Idempotent-Replayed: {$ref: '#/components/headers/IdempotentReplayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecipientBatchResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /send-jobs/{id}/submit:
    post:
      tags: [Sending]
      operationId: submitSendJob
      summary: Atomically seal the recipient set and queue the job.
      description: >-
        Rejects (422) an empty job, a job over the configured recipient
        ceiling, missing class metadata, or an unverified sending domain (in
        production also one without active DKIM), except in explicitly
        controlled local/test modes. On success the staged recipient set
        becomes immutable and the job becomes `queued`. Submitting a job that is
        already sealed returns 202 with its current state, so retries are safe.
        Returns 409 for a cancelled or failed job.
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '202':
          description: Job sealed and queued (or already sealed; current state returned).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SendJob'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /send-jobs/{id}:
    get:
      tags: [Sending]
      operationId: getSendJob
      summary: Retrieve send-job summary.
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Job state.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SendJob'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /send-jobs/{id}/messages:
    get:
      tags: [Sending]
      operationId: listSendJobMessages
      summary: Paginated recipient/message state.
      description: >-
        Messages are created by the delivery service as it processes the job,
        so `collecting` and `queued` jobs return an empty page and a
        `processing` job returns a partial one.
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: current_status
          in: query
          required: false
          description: Filter by current message status.
          schema: {$ref: '#/components/schemas/MessageStatus'}
      responses:
        '200':
          description: One page of messages, ordered by message id ascending.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MessagePage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /messages/{id}/events:
    get:
      tags: [Messages]
      operationId: listMessageEvents
      summary: Retrieve the append-only event history of one message.
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of events ordered by occurred_at ascending, then id.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MessageEventPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /webhooks/test:
    post:
      tags: [Webhooks]
      operationId: testWebhook
      summary: Record a `webhook.test` event for one of the client's webhook endpoints.
      description: >-
        Endpoints are registered per client through the client dashboard (or the
        audited console), or created by the approval of an application connection;
        endpoint management is not part of the public API. The
        request names exactly one endpoint (`webhook_endpoint_id`, required). The
        test event is written to the transactional outbox and delivered
        asynchronously by the Symfony webhook worker to that endpoint only; the
        response returns its id at once and the request never calls the endpoint.
        An endpoint that is not this client's is 404 (as if it did not exist); a
        disabled endpoint is 409 `webhook-endpoint-disabled` and records nothing.
        `webhook.test` ignores subscriptions.
      x-smarthost-available-from-phase: 7
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WebhookTestRequest'}
      responses:
        '202':
          description: Test event recorded for delivery.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebhookTestResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: The webhook endpoint is disabled (`webhook-endpoint-disabled`); no event is recorded.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /global-suppressions:
    post:
      tags: [Suppressions]
      operationId: createGlobalOptOut
      summary: Report an explicit recipient global opt-out.
      description: >-
        Records that the recipient explicitly asked not to receive email from any
        source using this Smarthost installation. Never use it for an ordinary
        list or newsletter unsubscribe. The address is normalised (D-18/D-32) and
        suppressed globally with reason `recipient_global_opt_out`; no other
        reason and no domain scope can be requested. Requires the operator-granted
        capability (403 without it). As a do-not-contact operation it is accepted
        in every client status that authenticates, including `pending_approval`
        and `suspended` (D-37). Returns 201 with the new opt-out, or 200 with the
        existing opt-out when this client already has an active one for the
        address. Each accepted request is recorded durably (D-38): replaying the
        same Idempotency-Key with the same body returns that request's original
        status and opt-out with `Idempotent-Replayed: true`, even after the
        opt-out was lifted, and never creates a new opt-out. The representation
        never reveals other suppressions of the address.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GlobalOptOutCreateRequest'}
      responses:
        '200':
          description: >-
            This client already had an active opt-out for the address; it is returned
            unchanged (or an idempotent replay of such a request).
          headers:
            Location: {$ref: '#/components/headers/Location'}
            Idempotent-Replayed: {$ref: '#/components/headers/IdempotentReplayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GlobalOptOut'}
        '201':
          description: Opt-out recorded (or idempotent replay).
          headers:
            Location: {$ref: '#/components/headers/Location'}
            Idempotent-Replayed: {$ref: '#/components/headers/IdempotentReplayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GlobalOptOut'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/GlobalSuppressionForbidden'}
        '409': {$ref: '#/components/responses/IdempotencyInProgress'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /global-suppressions/{id}:
    get:
      tags: [Suppressions]
      operationId: getGlobalOptOut
      summary: Retrieve a global opt-out this client reported.
      description: Opt-outs reported by other clients and system suppressions are never visible (404).
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: The opt-out.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GlobalOptOut'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /global-suppressions/{id}/lift:
    post:
      tags: [Suppressions]
      operationId: liftGlobalOptOut
      summary: Report that the recipient withdrew a global opt-out this client reported.
      description: >-
        Sets `lifted_at` on this client's own opt-out; the record and its audit
        history are kept. Naturally idempotent: lifting an already lifted opt-out
        returns it unchanged. Only the opt-out is lifted: any other active
        suppression of the address (a hard bounce, a complaint, an operator block
        or another client's opt-out) still prevents sending. Requires the
        capability and an `active` or `throttled` client (403 otherwise, including
        for `pending_approval` and `suspended` clients; D-37).
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: The opt-out, now lifted.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GlobalOptOut'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/GlobalSuppressionForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /blocks:
    get:
      tags: [Blocks]
      operationId: listAccountBlocks
      summary: The account's blocks, newest first.
      description: >-
        Only this account's own blocks (reason `account_block`): never the
        installation's suppressions (bounces, complaints, opt-outs, operator
        blocks), so the list is not a lookup of other suppressions.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: status
          in: query
          required: false
          description: '`active` (the default), `lifted` or `all`.'
          schema: {type: string, enum: [active, lifted, all], default: active}
        - name: value
          in: query
          required: false
          description: >-
            Only the blocks of exactly this address or domain (normalised like a
            new block). An address does not also return the block of its domain:
            ask for the domain too.
          schema: {type: string, minLength: 1, maxLength: 320}
      responses:
        '200':
          description: One page of blocks, newest first.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccountBlockPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
    post:
      tags: [Blocks]
      operationId: createAccountBlock
      summary: Block an address or a whole domain for this account.
      description: >-
        Give exactly one of `address` or `domain`. The value is normalised like
        recipients (an address keeps its local part; a domain is lower-cased) and
        from then on this account's messages to it, or to any address at the
        domain (exactly that domain, not its subdomains), are suppressed before
        submission, also those already queued. Like an opt-out it is a
        do-not-contact operation, accepted in every account status that
        authenticates. Returns 201 with the new block, or 200 with the existing
        one when the value is already blocked. Each accepted request is recorded
        durably: replaying the same Idempotency-Key with the same body returns
        that request's original status and block with `Idempotent-Replayed:
        true`, even after the block was lifted.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AccountBlockCreateRequest'}
      responses:
        '200':
          description: The value was already blocked; the active block is returned unchanged (or an idempotent replay).
          headers:
            Location: {$ref: '#/components/headers/Location'}
            Idempotent-Replayed: {$ref: '#/components/headers/IdempotentReplayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccountBlock'}
        '201':
          description: Block created (or an idempotent replay).
          headers:
            Location: {$ref: '#/components/headers/Location'}
            Idempotent-Replayed: {$ref: '#/components/headers/IdempotentReplayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccountBlock'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/IdempotencyInProgress'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /blocks/{id}:
    get:
      tags: [Blocks]
      operationId: getAccountBlock
      summary: Retrieve one of the account's blocks.
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: The block.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccountBlock'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /blocks/{id}/lift:
    post:
      tags: [Blocks]
      operationId: liftAccountBlock
      summary: Lift one of the account's blocks.
      description: >-
        Sets `lifted_at`; the record is kept. Naturally idempotent: lifting a
        lifted block returns it unchanged. Only this block is lifted: any other
        suppression of the address (a bounce, a complaint, an opt-out, an
        operator block, or the account's block of the address's domain) still
        prevents sending. Lifting makes mail sendable again, so it needs an
        `active` or `throttled` account (403 otherwise).
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: The block, now lifted.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccountBlock'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /connect/exchange:
    post:
      tags: [Connect]
      operationId: exchangeConnectCode
      summary: Exchange the single-use code of an approved connection for its credentials.
      description: >-
        The one operation without an API key: the application presents the code from
        its redirect, the PKCE code verifier whose `S256` challenge it gave to the
        connect page, and the same redirect URI. On success the connection becomes
        active: its API key and webhook endpoint are created in this request, and
        the raw key and the signing secret are returned here and never again (store
        them at once; the response is `Cache-Control: no-store`). An earlier
        connection of the client to the same webhook URL is ended in the same
        transaction. A code works once: after a successful exchange it answers 400
        like an unknown one. Every reason a code is not accepted - unknown, used,
        expired (10 minutes after the approval), its connection revoked, a wrong
        code verifier or a different redirect URI - is the same 400
        `invalid-connect-code`. 409 `connect-refused` means the code is good but the
        connection cannot be made now (the client is no longer active, or its API-key
        or webhook-endpoint limit was reached since the approval): nothing was
        created, and the code stays usable until it expires. Requests are limited
        per client address (429 `rate-limited`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConnectExchangeRequest'}
      responses:
        '200':
          description: The connection is active; its credentials, shown once.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConnectCredentials'}
        '400':
          description: >-
            Malformed request, or the code is not accepted (`invalid-connect-code`):
            unknown, used, expired or revoked, or the code verifier or redirect URI
            does not match.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '409':
          description: >-
            The connection cannot be made now (`connect-refused`); nothing was created.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /connection:
    delete:
      tags: [Connect]
      operationId: deleteConnection
      summary: End the connection that issued this API key.
      description: >-
        For a connected application to disconnect itself: authenticated with the API
        key its connection issued, it revokes that key and removes the connection's
        webhook endpoint (no further events are delivered to it). Later requests with
        the key fail with 401. Accepted in every client status that authenticates.
        404 when the API key was not issued by a connection (a key created in the
        dashboard belongs to none).
      responses:
        '204':
          description: The connection is ended; the key is revoked and the endpoint removed.
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /sending-domains:
    get:
      tags: [Sending domains]
      operationId: listSendingDomains
      summary: The client's sending domains and whether each can send now.
      description: >-
        Read-only; domains are added and verified in the dashboard. Lets an
        application warn before it sends from a domain that cannot send yet:
        `can_send` is the submit rule of a send job applied to the domain as it is
        now. A client has at most its sending-domain limit of domains, so the list
        is not paginated; it is ordered by domain.
      responses:
        '200':
          description: The domains.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SendingDomainList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

webhooks:
  smarthostEvent:
    post:
      operationId: receiveSmarthostEvent
      summary: Signed event delivered to a registered client webhook endpoint.
      description: |
        Delivered as an HTTPS POST by the Smarthost webhook worker (specification
        2.8). The body is a `WebhookEvent` in UTF-8 JSON. Headers:

        * `Content-Type: application/json`; `User-Agent: Catto-Mail-Smarthost/<version>`.
        * `Smarthost-Event-Id`: the event `id`. Delivery is **at-least-once**: a
          request whose outcome Smarthost could not record (timeout, worker
          restart) is sent again, so de-duplicate on this id.
        * `Smarthost-Event-Type`: the event `type`.
        * `Smarthost-Delivery-Id` and `Smarthost-Delivery-Attempt` (1, 2, ...):
          diagnostics only; the same event keeps its id across attempts.
        * `Smarthost-Signature`: `t=<unix-seconds>,v1=<hex>` where `v1` is
          HMAC-SHA256 over the exact bytes `<t>.<raw request body>` using the
          endpoint's signing secret. While a rotated-out secret is still within
          its overlap window, a second `v1=` value signed with the previous
          secret is included; accept the request if any value matches. Compare
          in constant time, verify before parsing the JSON, and reject
          timestamps more than 5 minutes from your clock.

        Any 2xx response acknowledges delivery; acknowledge quickly and process
        asynchronously. 408, 425, 429, 5xx, timeouts and connection failures are
        retried with exponential backoff (a `Retry-After` within the configured
        maximum is honoured) up to `APP_WEBHOOK_MAX_ATTEMPTS`; other responses,
        including other 4xx and any 3xx (redirects are never followed), fail
        the delivery without retry. Webhooks are only sent to destinations that
        resolve to public addresses. Endpoints are never disabled automatically.
      parameters:
        - name: Smarthost-Signature
          in: header
          required: true
          schema: {type: string, example: 't=1767225600,v1=5257a869e7ecebeda32affa62cdca3fa51cad7e77a0e56ff536d0ce8e108d8bd'}
        - name: Smarthost-Event-Id
          in: header
          required: true
          schema: {$ref: '#/components/schemas/Uuid'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WebhookEvent'}
      responses:
        '2XX':
          description: Acknowledged.

components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      bearerFormat: opaque API key
      description: >-
        `Authorization: Bearer <api key>`. Keys are shown once at creation and
        stored only as a hash. Revoked keys return 401. API keys are for
        machine clients only and are never accepted for dashboard login.

  headers:
    Location:
      description: URL of the created resource.
      schema: {type: string, format: uri-reference}
    IdempotentReplayed:
      description: >-
        Present with value `true` when the response replays an earlier request with
        the same Idempotency-Key: no side effect was repeated, and the status code,
        Location and resource identity are those of the original operation.
      schema: {type: string, enum: ['true']}
    RetryAfter:
      description: Seconds to wait before retrying.
      schema: {type: integer, minimum: 0}

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Client-generated unique key (a UUID is recommended), scoped to the
        client and to the endpoint (and, for recipient batches, to the send
        job). Same key + same body is a replay: no repeated side effect, the same
        resource, the same status code and Location, and `Idempotent-Replayed:
        true`. For resource creation the body is the resource's current
        representation (response bodies are not stored); a recipient-batch replay
        reproduces its original result, including the running total at that time.
        Same key + different body returns 422. Same key while the first request is
        still being processed returns 409.
      schema: {type: string, minLength: 8, maxLength: 255, pattern: '^[\x21-\x7E]+$'}
    ResourceId:
      name: id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Uuid'}
    Limit:
      name: limit
      in: query
      required: false
      schema: {type: integer, minimum: 1, maximum: 1000, default: 100}
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from `pagination.next_cursor` of the previous page.
      schema: {type: string, maxLength: 512}

  responses:
    BadRequest:
      description: Malformed request (unparseable JSON, bad query parameter, missing Idempotency-Key).
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Unauthorized:
      description: Missing, invalid or revoked API key.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Forbidden:
      description: >-
        The client may not create or add work in its current status
        (`pending_approval` or `suspended`); only `active` and `throttled` clients
        may. Reads remain available.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    GlobalSuppressionForbidden:
      description: >-
        The client does not hold the operator-granted global-opt-out capability,
        or (lifting only) is `pending_approval` or `suspended`.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    NotFound:
      description: Resource does not exist or belongs to another client.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Conflict:
      description: >-
        The job is not in a state that permits this operation (e.g. no longer
        `collecting`), or an identical request is in flight.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    IdempotencyInProgress:
      description: A request with the same Idempotency-Key is still being processed.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    PayloadTooLarge:
      description: Request body exceeds the configured size limit (10 MiB).
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    UnprocessableEntity:
      description: >-
        Semantically invalid request: schema violation, recipient ceiling
        exceeded, duplicate recipient address, class-specific rules, unknown or
        unverified sending domain, empty job at submit, or an Idempotency-Key
        reused with a different body.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    TooManyRequests:
      description: >-
        Rate limit exceeded (problem type `rate-limited`), or the request would exceed
        one of the client's quotas for the current calendar day or month in the
        installation's time zone (problem type
        `quota-exceeded`, with the `quota` member). `Retry-After` gives the seconds
        until a retry can succeed.
      headers:
        Retry-After: {$ref: '#/components/headers/RetryAfter'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}

  schemas:
    # ---- primitives -------------------------------------------------------
    Uuid:
      type: string
      format: uuid
      description: UUIDv7.
    Timestamp:
      type: string
      format: date-time
      description: RFC 3339 with the installation time zone's offset (e.g. +02:00).
    ExternalReference:
      type: string
      minLength: 1
      maxLength: 255
      description: Client-supplied opaque reference, scoped to the client. Not required to be unique.
    ConfidenceLevel:
      type: string
      description: Categorical confidence; never a probability.
      enum: [low, medium, high]
    Pagination:
      type: object
      additionalProperties: false
      required: [limit, next_cursor]
      properties:
        limit: {type: integer}
        next_cursor:
          type: [string, 'null']
          description: Null when there are no further pages.
    EmailIdentity:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: {type: string, format: email, maxLength: 320}
        name: {type: string, maxLength: 200}

    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [type, title, status]
      properties:
        type: {type: string, format: uri-reference, example: 'https://smarthost.example.com/problems/validation-error'}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        instance: {type: string, format: uri-reference}
        quota:
          description: >-
            Present on `quota-exceeded` (429): the quota the request would have exceeded.
            Only the client's own quota and usage are disclosed.
          type: object
          required: [metric, period, limit, used, requested, resets_at]
          properties:
            metric: {type: string, enum: [validation_jobs, validation_addresses, send_jobs, send_recipients]}
            period: {type: string, enum: [day, month]}
            limit: {type: integer}
            used: {type: integer, description: Admitted in the current period before this request.}
            requested: {type: integer}
            resets_at: {type: string, format: date-time}
        errors:
          type: array
          description: Field-level errors for 422 responses.
          items:
            type: object
            required: [pointer, message]
            properties:
              pointer: {type: string, description: 'JSON Pointer into the request body, e.g. /recipients/3/email_address.'}
              message: {type: string}

    # ---- vocabulary enums (must match docs/contracts/status-vocabulary.yaml)
    ValidationJobStatus:
      type: string
      enum: [queued, processing, completed, failed, cancelled]
    SendJobStatus:
      type: string
      enum: [collecting, queued, processing, dispatched, completed, failed, cancelled]
    MessageClass:
      type: string
      enum: [transactional, subscription]
    SyntaxStatus:
      type: string
      enum: [valid, invalid]
    DomainStatus:
      type: string
      enum: [mx, null_mx, address_fallback, no_mail_host, nxdomain, temporary_failure, invalid_response, skipped]
    SmtpStatus:
      type: string
      enum: [accepted, rejected, temporary_failure, blocked, timeout, connection_failed, inconclusive, skipped]
    OverallClassification:
      type: string
      enum: [deliverable, probably_deliverable, undeliverable, temporarily_unverifiable, unknown, risky]
    TypoReasonCode:
      type: string
      enum: [provider_domain_edit_distance, transposition, tld_typo, legacy_domain_alias, other_domain_typo_rule]
    MessageStatus:
      type: string
      enum:
        - created
        - queued
        - submitted
        - deferred
        - outcome_unknown
        - remote_accepted
        - soft_bounced
        - hard_bounced
        - complained
        - failed
        - suppressed
    MessageEventType:
      type: string
      enum:
        - message_created
        - message_queued
        - message_suppressed
        - submission_failed
        - submitted_to_postfix
        - postfix_queued
        - delivery_attempt
        - deferred
        - connection_failure
        - remote_accepted
        - soft_bounce
        - hard_bounce
        - complaint
        - transport_outcome_unknown
        - open_recorded
        - click_recorded
        - dsn_unmatched
    SendingDomainStatus:
      type: string
      enum: [pending, verified, disabled]
    DkimStatus:
      type: string
      enum: [not_configured, pending_dns, active, disabled]
    WebhookEventType:
      type: string
      enum:
        - validation.completed
        - validation.failed
        - send.completed
        - send.failed
        - message.hard_bounced
        - message.complained
        - webhook.test
        - repermission.responded

    # ---- validation -------------------------------------------------------
    ValidationAddressInput:
      type: object
      additionalProperties: false
      required: [address]
      properties:
        address:
          type: string
          minLength: 1
          maxLength: 512
          description: Address exactly as held by the client; retained verbatim as `original_address`.
        external_address_reference:
          $ref: '#/components/schemas/ExternalReference'
          description: >-
            Optional opaque client reference for this address (e.g. a source
            record id), separate from the job's external_reference.

    ValidationJobCreateRequest:
      type: object
      additionalProperties: false
      required: [addresses]
      properties:
        external_reference: {$ref: '#/components/schemas/ExternalReference'}
        addresses:
          type: array
          minItems: 1
          maxItems: 10000
          description: Duplicates are permitted and validated individually. Smarthost never rewrites an address.
          items: {$ref: '#/components/schemas/ValidationAddressInput'}

    ValidationJob:
      type: object
      additionalProperties: false
      required: [id, status, submitted_at, total_addresses, processed_count, classification_counts]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        external_reference:
          oneOf:
            - {$ref: '#/components/schemas/ExternalReference'}
            - {type: 'null'}
        status: {$ref: '#/components/schemas/ValidationJobStatus'}
        submitted_at: {$ref: '#/components/schemas/Timestamp'}
        started_at:
          oneOf: [{$ref: '#/components/schemas/Timestamp'}, {type: 'null'}]
        completed_at:
          oneOf: [{$ref: '#/components/schemas/Timestamp'}, {type: 'null'}]
        total_addresses: {type: integer, minimum: 1, maximum: 10000}
        processed_count: {type: integer, minimum: 0}
        classification_counts:
          $ref: '#/components/schemas/ClassificationCounts'

    ClassificationCounts:
      type: object
      description: Count of processed addresses per overall_classification. All keys always present.
      additionalProperties: false
      required: [deliverable, probably_deliverable, undeliverable, temporarily_unverifiable, unknown, risky]
      properties:
        deliverable: {type: integer, minimum: 0}
        probably_deliverable: {type: integer, minimum: 0}
        undeliverable: {type: integer, minimum: 0}
        temporarily_unverifiable: {type: integer, minimum: 0}
        unknown: {type: integer, minimum: 0}
        risky: {type: integer, minimum: 0}

    ValidationAddress:
      type: object
      additionalProperties: false
      description: >-
        Evidence-based result for one submitted address. Result fields are null
        until `checked_at` is set. A suggestion is never applied automatically.
      required:
        - id
        - external_address_reference
        - original_address
        - normalized_address
        - syntax_status
        - domain_status
        - smtp_status
        - is_role
        - is_disposable
        - is_catch_all_or_accept_all
        - is_domain_typo_suspected
        - suggested_address
        - suggestion_reason_code
        - suggestion_confidence
        - overall_classification
        - confidence
        - diagnostic_code
        - diagnostic_text
        - checked_at
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        external_address_reference:
          oneOf: [{$ref: '#/components/schemas/ExternalReference'}, {type: 'null'}]
        original_address: {type: string, description: Exactly as submitted.}
        normalized_address:
          type: [string, 'null']
          description: Surrounding whitespace removed and domain lower-cased; local part untouched. Null if unparseable.
        syntax_status:
          oneOf: [{$ref: '#/components/schemas/SyntaxStatus'}, {type: 'null'}]
        domain_status:
          oneOf: [{$ref: '#/components/schemas/DomainStatus'}, {type: 'null'}]
        smtp_status:
          oneOf: [{$ref: '#/components/schemas/SmtpStatus'}, {type: 'null'}]
        is_role: {type: [boolean, 'null']}
        is_disposable: {type: [boolean, 'null']}
        is_catch_all_or_accept_all: {type: [boolean, 'null']}
        is_domain_typo_suspected: {type: [boolean, 'null']}
        suggested_address:
          type: [string, 'null']
          description: A suggestion only. Never applied automatically.
        suggestion_reason_code:
          oneOf: [{$ref: '#/components/schemas/TypoReasonCode'}, {type: 'null'}]
        suggestion_confidence:
          oneOf: [{$ref: '#/components/schemas/ConfidenceLevel'}, {type: 'null'}]
        overall_classification:
          oneOf: [{$ref: '#/components/schemas/OverallClassification'}, {type: 'null'}]
        confidence:
          oneOf: [{$ref: '#/components/schemas/ConfidenceLevel'}, {type: 'null'}]
        diagnostic_code:
          type: [string, 'null']
          description: Stable machine-readable code, e.g. smtp.rcpt.5.1.1 or dns.nxdomain.
        diagnostic_text: {type: [string, 'null'], description: Human-readable diagnostic; may quote the remote server.}
        checked_at:
          oneOf: [{$ref: '#/components/schemas/Timestamp'}, {type: 'null'}]

    ValidationAddressPage:
      type: object
      additionalProperties: false
      required: [data, pagination]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/ValidationAddress'}
        pagination: {$ref: '#/components/schemas/Pagination'}

    # ---- sending ----------------------------------------------------------
    TrackingOptions:
      type: object
      additionalProperties: false
      description: Delivery-time instrumentation switches. Both default to false (tracking disabled).
      properties:
        opens:
          type: boolean
          default: false
          description: Insert an open-tracking pixel into the HTML part. Messages without HTML get no open tracking.
        clicks:
          type: boolean
          default: false
          description: >-
            Rewrite eligible absolute HTTP/HTTPS links in the HTML part through
            the click tracker. Never rewritten: plain-text URLs, `mailto:`,
            fragment-only and non-HTTP(S) links, and unsubscribe URLs.

    SendJobCreateRequest:
      type: object
      additionalProperties: false
      required: [external_reference, message_class, sender_identity]
      description: >-
        Job-level metadata only; recipients are added in batches. `client_id`
        and arbitrary headers are not accepted. `list_id` is mandatory for
        `subscription` and not accepted for `transactional`.
      properties:
        external_reference: {$ref: '#/components/schemas/ExternalReference'}
        message_class: {$ref: '#/components/schemas/MessageClass'}
        list_id:
          type: string
          minLength: 1
          maxLength: 255
          description: RFC 2919 `List-Id` header value.
        sender_identity:
          $ref: '#/components/schemas/EmailIdentity'
          description: >-
            Header From. Its domain must be a registered sending domain of the
            client. The envelope return-path is always a Smarthost VERP address.
        reply_to:
          $ref: '#/components/schemas/EmailIdentity'
          description: Optional job-level Reply-To.
        tracking: {$ref: '#/components/schemas/TrackingOptions'}
      if:
        required: [message_class]
        properties: {message_class: {const: subscription}}
      then:
        required: [list_id]
      else:
        not: {required: [list_id]}

    Recipient:
      type: object
      additionalProperties: false
      required: [external_recipient_reference, email_address, subject]
      description: >-
        One recipient with fully rendered, recipient-specific content produced
        by the client. No merge data or template syntax is accepted.
      properties:
        external_recipient_reference: {$ref: '#/components/schemas/ExternalReference'}
        email_address:
          type: string
          minLength: 3
          maxLength: 320
          description: >-
            Normalised for matching by trimming surrounding whitespace and
            lower-casing the domain. The local part is preserved, so
            `John@example.com` and `john@example.com` are distinct.
        subject: {type: string, minLength: 1, maxLength: 998, description: Rendered subject.}
        html_body: {type: string, minLength: 1, description: Rendered HTML body.}
        text_body: {type: string, minLength: 1, description: Rendered plain-text body.}
        unsubscribe_url:
          type: string
          format: uri
          pattern: '^https://'
          maxLength: 2048
          description: >-
            Opaque per-recipient one-click unsubscribe URL generated and hosted
            by the client (RFC 8058). Mandatory for `subscription` jobs and not
            accepted for `transactional` jobs. It is written to
            `List-Unsubscribe` and `List-Unsubscribe-Post` and is never
            click-tracked.
      anyOf:
        - required: [html_body]
        - required: [text_body]

    RecipientBatchRequest:
      type: object
      additionalProperties: false
      required: [recipients]
      properties:
        recipients:
          type: array
          minItems: 1
          maxItems: 500
          description: >-
            Contract ceiling 500 per request. The effective limit is
            APP_SEND_JOB_MAX_RECIPIENTS_PER_BATCH, which may only lower it.
          items: {$ref: '#/components/schemas/Recipient'}

    RecipientBatchResult:
      type: object
      additionalProperties: false
      required: [batch_id, accepted_count, total_recipients]
      properties:
        batch_id: {$ref: '#/components/schemas/Uuid'}
        accepted_count: {type: integer, minimum: 1, maximum: 500}
        total_recipients:
          type: integer
          minimum: 1
          maximum: 10000
          description: Running total across all accepted batches of the job.

    SendJob:
      type: object
      additionalProperties: false
      required:
        - id
        - external_reference
        - message_class
        - sender_identity
        - status
        - created_at
        - queued_at
        - started_at
        - dispatch_completed_at
        - completed_at
        - total_recipients
        - summary_counts
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        external_reference: {$ref: '#/components/schemas/ExternalReference'}
        message_class: {$ref: '#/components/schemas/MessageClass'}
        list_id: {type: [string, 'null']}
        sender_identity: {$ref: '#/components/schemas/EmailIdentity'}
        reply_to:
          oneOf: [{$ref: '#/components/schemas/EmailIdentity'}, {type: 'null'}]
        tracking: {$ref: '#/components/schemas/TrackingOptions'}
        status: {$ref: '#/components/schemas/SendJobStatus'}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        queued_at:
          description: When the job was sealed by submit.
          oneOf: [{$ref: '#/components/schemas/Timestamp'}, {type: 'null'}]
        started_at:
          oneOf: [{$ref: '#/components/schemas/Timestamp'}, {type: 'null'}]
        dispatch_completed_at:
          description: When the job became `dispatched`.
          oneOf: [{$ref: '#/components/schemas/Timestamp'}, {type: 'null'}]
        completed_at:
          description: When every message reached a terminal knowledge state.
          oneOf: [{$ref: '#/components/schemas/Timestamp'}, {type: 'null'}]
        total_recipients:
          type: integer
          minimum: 0
          maximum: 10000
          description: Running total while collecting; fixed once sealed.
        summary_counts: {$ref: '#/components/schemas/MessageStatusCounts'}

    MessageStatusCounts:
      type: object
      description: Count of messages per current_status. All keys always present.
      additionalProperties: false
      required:
        - created
        - queued
        - submitted
        - deferred
        - outcome_unknown
        - remote_accepted
        - soft_bounced
        - hard_bounced
        - complained
        - failed
        - suppressed
      properties:
        created: {type: integer, minimum: 0}
        queued: {type: integer, minimum: 0}
        submitted: {type: integer, minimum: 0}
        deferred: {type: integer, minimum: 0}
        outcome_unknown: {type: integer, minimum: 0}
        remote_accepted: {type: integer, minimum: 0}
        soft_bounced: {type: integer, minimum: 0}
        hard_bounced: {type: integer, minimum: 0}
        complained: {type: integer, minimum: 0}
        failed: {type: integer, minimum: 0}
        suppressed: {type: integer, minimum: 0}

    Message:
      type: object
      additionalProperties: false
      required: [id, send_job_id, external_recipient_reference, recipient_address, current_status, created_at, resolved_at]
      description: >-
        One recipient message. VERP tokens, return paths, tracking tokens and
        Postfix queue ids are internal and not exposed.
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        send_job_id: {$ref: '#/components/schemas/Uuid'}
        external_recipient_reference: {$ref: '#/components/schemas/ExternalReference'}
        recipient_address: {type: string, description: Normalised address used for delivery.}
        current_status: {$ref: '#/components/schemas/MessageStatus'}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        resolved_at:
          description: First time the message reached a terminal status; never changed afterwards.
          oneOf: [{$ref: '#/components/schemas/Timestamp'}, {type: 'null'}]

    MessagePage:
      type: object
      additionalProperties: false
      required: [data, pagination]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/Message'}
        pagination: {$ref: '#/components/schemas/Pagination'}

    MessageEvent:
      type: object
      additionalProperties: false
      required: [id, message_id, event_type, smtp_code, enhanced_status_code, remote_host, diagnostic, occurred_at]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        message_id: {$ref: '#/components/schemas/Uuid'}
        event_type: {$ref: '#/components/schemas/MessageEventType'}
        smtp_code: {type: [integer, 'null'], minimum: 200, maximum: 599}
        enhanced_status_code:
          type: [string, 'null']
          pattern: '^[245]\.\d{1,3}\.\d{1,3}$'
        remote_host: {type: [string, 'null']}
        diagnostic: {type: [string, 'null']}
        occurred_at: {$ref: '#/components/schemas/Timestamp'}

    MessageEventPage:
      type: object
      additionalProperties: false
      required: [data, pagination]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/MessageEvent'}
        pagination: {$ref: '#/components/schemas/Pagination'}

    # ---- suppressions (D-30) ----------------------------------------------
    GlobalOptOutCreateRequest:
      type: object
      additionalProperties: false
      required: [email_address]
      description: >-
        An explicit recipient global opt-out. `client_id`, `reason` and a domain
        scope are not accepted.
      properties:
        email_address:
          type: string
          minLength: 3
          maxLength: 320
          description: >-
            Normalised like recipients (surrounding whitespace trimmed, domain
            lower-cased, local part preserved).
        external_reference:
          $ref: '#/components/schemas/ExternalReference'
          description: Optional opaque client reference (for example the client's own record of the request).

    GlobalOptOut:
      type: object
      additionalProperties: false
      required: [id, email_address, reason, status, external_reference, created_at, lifted_at]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        email_address: {type: string, description: The normalised address that is suppressed.}
        reason:
          type: string
          enum: [recipient_global_opt_out]
        status:
          type: string
          enum: [active, lifted]
        external_reference:
          oneOf: [{$ref: '#/components/schemas/ExternalReference'}, {type: 'null'}]
        created_at: {$ref: '#/components/schemas/Timestamp'}
        lifted_at:
          oneOf: [{$ref: '#/components/schemas/Timestamp'}, {type: 'null'}]

    AccountBlockCreateRequest:
      type: object
      additionalProperties: false
      description: >-
        Exactly one of `address` and `domain` (422 otherwise). A domain blocks
        every address at exactly that domain.
      properties:
        address:
          type: string
          minLength: 3
          maxLength: 320
          description: An email address, normalised like recipients.
        domain:
          type: string
          minLength: 1
          maxLength: 253
          description: A domain name such as `example.org` (no `@`), lower-cased.
        external_reference:
          $ref: '#/components/schemas/ExternalReference'
          description: Optional opaque client reference (for example the application's own record of the block).

    AccountBlock:
      type: object
      additionalProperties: false
      required: [id, scope, value, status, external_reference, created_at, lifted_at]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        scope:
          type: string
          enum: [address, domain]
        value: {type: string, description: The normalised address or the lower-cased domain.}
        status:
          type: string
          enum: [active, lifted]
        external_reference:
          oneOf: [{$ref: '#/components/schemas/ExternalReference'}, {type: 'null'}]
        created_at: {$ref: '#/components/schemas/Timestamp'}
        lifted_at:
          oneOf: [{$ref: '#/components/schemas/Timestamp'}, {type: 'null'}]

    AccountBlockPage:
      type: object
      additionalProperties: false
      required: [data, pagination]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/AccountBlock'}
        pagination: {$ref: '#/components/schemas/Pagination'}

    # ---- sending domains and connect (specification 2.12) -----------------
    SendingDomain:
      type: object
      additionalProperties: false
      required: [id, domain, status, dkim_status, verified_at, can_send, setup_url]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        domain: {type: string, description: Lower-case domain name.}
        status:
          $ref: '#/components/schemas/SendingDomainStatus'
          description: >-
            `pending` until the DNS TXT challenge matched, then `verified`; `disabled`
            domains are never usable.
        dkim_status:
          $ref: '#/components/schemas/DkimStatus'
          description: '`active` when the installation signs mail of this domain.'
        verified_at:
          oneOf: [{$ref: '#/components/schemas/Timestamp'}, {type: 'null'}]
        can_send:
          type: boolean
          description: >-
            Whether a send job whose sender is in this domain can be submitted now:
            the domain is verified and not disabled and, on a production installation,
            its DKIM status is `active`. False does not stop a job from being created
            or filled; its submit answers 422 `submit-rejected` until this is true.
        setup_url:
          type: string
          format: uri
          description: >-
            The page of the account's dashboard where a person publishes this domain's
            DNS records, one step at a time, and follows the domain until it can send
            (specification 2.13). An application may link a client admin there. It may
            add a `back` query parameter, an absolute URL on the origin of its own
            connection's `redirect_uri`, and the page then offers a link back to it.

    SendingDomainList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/SendingDomain'}

    ConnectExchangeRequest:
      type: object
      additionalProperties: false
      required: [code, code_verifier, redirect_uri]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 512
          description: The `code` of the redirect back from the connect page.
        code_verifier:
          type: string
          minLength: 1
          maxLength: 512
          description: >-
            The PKCE code verifier (RFC 7636: 43 to 128 characters of
            `A-Z a-z 0-9 - . _ ~`) whose `S256` challenge was given to the connect page.
        redirect_uri:
          type: string
          minLength: 1
          maxLength: 2000
          description: Exactly the `redirect_uri` given to the connect page.

    ConnectCredentials:
      type: object
      additionalProperties: false
      required: [connection_id, application_name, client_name, api_base_url, api_key, webhook, sending_domains]
      description: >-
        Everything a connected application needs, returned once. The API key and the
        signing secret cannot be retrieved again: Smarthost stores the key only as a
        hash. Global opt-out reporting is not part of a connection.
      properties:
        connection_id: {$ref: '#/components/schemas/Uuid'}
        application_name: {type: string, maxLength: 100, description: As given to the connect page; the name of the API key.}
        client_name: {type: string, description: The client workspace the person connected.}
        api_base_url:
          type: string
          format: uri
          description: The base URL of this API, ending in `/v1`.
        api_key:
          type: string
          pattern: '^shk_[A-Za-z0-9_-]{43}$'
          description: The `Authorization` bearer key of this connection.
        webhook:
          type: object
          additionalProperties: false
          required: [endpoint_id, url, signing_secret, events]
          properties:
            endpoint_id:
              $ref: '#/components/schemas/Uuid'
              description: The `webhook_endpoint_id` for `POST /webhooks/test`.
            url: {type: string, description: The `webhook_url` given to the connect page.}
            signing_secret:
              type: string
              pattern: '^whsec_[A-Za-z0-9_-]{43}$'
              description: The secret of `Smarthost-Signature` for this endpoint.
            events:
              type: array
              description: The event types the endpoint is subscribed to.
              items: {$ref: '#/components/schemas/WebhookEventType'}
        sending_domains:
          type: array
          description: The client's sending domains at this moment (as `GET /sending-domains`).
          items: {$ref: '#/components/schemas/SendingDomain'}

    # ---- webhooks ---------------------------------------------------------
    WebhookTestRequest:
      type: object
      additionalProperties: false
      required: [webhook_endpoint_id]
      properties:
        webhook_endpoint_id: {$ref: '#/components/schemas/Uuid'}

    WebhookTestResult:
      type: object
      additionalProperties: false
      required: [webhook_event_id]
      properties:
        webhook_event_id: {$ref: '#/components/schemas/Uuid'}

    WebhookEvent:
      type: object
      additionalProperties: false
      required: [id, type, created_at, data]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        type: {$ref: '#/components/schemas/WebhookEventType'}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        data:
          description: >-
            validation.* carries a ValidationJob; send.* carries a SendJob;
            message.* carries a MessageWebhookData; repermission.responded carries a
            RepermissionWebhookData; webhook.test carries an empty object.
          oneOf:
            - {$ref: '#/components/schemas/ValidationJob'}
            - {$ref: '#/components/schemas/SendJob'}
            - {$ref: '#/components/schemas/MessageWebhookData'}
            - {$ref: '#/components/schemas/RepermissionWebhookData'}
            - {type: object, additionalProperties: false, maxProperties: 0}

    RepermissionWebhookData:
      type: object
      additionalProperties: false
      description: >-
        A recipient answered a re-permission message sent from an administrator address batch
        (specification 2.11). The subscription itself belongs to your application: apply the
        answer to your own subscriber record. `unsubscribed` is your list's unsubscribe and
        creates no Smarthost suppression; `global_opt_out` means the recipient asked for no mail
        through this Smarthost at all, and Smarthost has already recorded a global suppression.
        Answers can change (confirmed after unsubscribed, or the reverse) until a global opt-out,
        which is final; apply the newest `responded_at`.
      required: [batch, entry_id, address, response, responded_at]
      properties:
        batch:
          type: object
          additionalProperties: false
          required: [id, name, list_id]
          properties:
            id: {$ref: '#/components/schemas/Uuid'}
            name: {type: string, maxLength: 200}
            list_id: {type: string, maxLength: 100}
        entry_id: {$ref: '#/components/schemas/Uuid'}
        address: {type: string, maxLength: 320, description: The address as normalised by Smarthost (D-18).}
        response: {type: string, enum: [confirmed, unsubscribed, global_opt_out]}
        responded_at: {$ref: '#/components/schemas/Timestamp'}

    MessageWebhookData:
      type: object
      additionalProperties: false
      required: [message, event]
      properties:
        message: {$ref: '#/components/schemas/Message'}
        event: {$ref: '#/components/schemas/MessageEvent'}
