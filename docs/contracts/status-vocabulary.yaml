# Smarthost canonical status and event vocabulary
#
# Normative contract referenced by docs/20260908-1644-smarthost-llm-spec.yaml
# (specification 2.11). Every enum value used in the database, the /v1 API,
# webhooks, Python and Go MUST come from this file. scripts/check-contracts.py
# verifies that the spec, the OpenAPI document and the reference DDL use
# exactly these values.
#
# Each value carries `origin`:
#   spec      - the value is enumerated in the canonical specification
#   contract  - the specification delegates the detailed value list to this
#               contract file (the spec defines the field, this file its values)
#
# Storage convention: every enum is stored as lower_snake_case text with a
# CHECK constraint (not a PostgreSQL ENUM type) so values can be added by a
# Doctrine migration without ALTER TYPE.

vocabulary_version: "2.6.0"
specification_version: "2.11"

# ---------------------------------------------------------------------------
# Jobs
# ---------------------------------------------------------------------------

validation_job_status:
  description: Lifecycle of a public validation job (validation_jobs.status). D-29.
  values:
    queued:
      origin: spec
      terminal: false
      meaning: Accepted; addresses persisted; not yet claimed by a validator worker.
    processing:
      origin: spec
      terminal: false
      meaning: At least one address has been claimed by a validator worker.
    completed:
      origin: spec
      terminal: true
      meaning: >-
        Every address has a final overall_classification (which may be
        temporarily_unverifiable or unknown). Emits webhook validation.completed.
    failed:
      origin: spec
      terminal: true
      meaning: The job could not be processed as a whole. Emits webhook validation.failed.
    cancelled:
      origin: spec
      terminal: true
      meaning: Stopped by an operator. No public cancel endpoint exists in v1.
  transitions:
    queued: [processing, failed, cancelled]
    processing: [completed, failed, cancelled]

send_job_status:
  description: >-
    Lifecycle of a tracked send job (send_jobs.status). D-07, D-24, D-29.
    Operator throttling/suspension acts at client level (clients.status);
    the per-job emergency stop is `cancelled`.
  values:
    collecting:
      origin: spec
      terminal: false
      meaning: >-
        Created with job-level metadata; recipient batches may be added. The
        only state in which the recipient set may change.
    queued:
      origin: spec
      terminal: false
      meaning: Sealed by submit; recipient set immutable; awaiting the Go delivery daemon.
    processing:
      origin: spec
      terminal: false
      meaning: Go is creating messages from recipients and submitting them to Postfix.
    dispatched:
      origin: spec
      terminal: false
      meaning: >-
        Recipient creation/submission work is finished: every recipient has a
        message that was accepted into Postfix, deliberately suppressed, or hit
        an immediate submission failure. Sets dispatch_completed_at.
    completed:
      origin: spec
      terminal: true
      meaning: >-
        No automated SMTP transport resolution remains outstanding: every
        message has a terminal knowledge state (message_status.terminal,
        including outcome_unknown). Sets completed_at; emits send.completed.
        Later engagement, complaint or recovered transport events never reopen it.
    failed:
      origin: spec
      terminal: true
      meaning: The job as a whole could not be executed. Emits send.failed.
    cancelled:
      origin: spec
      terminal: true
      meaning: >-
        Operator emergency stop before dispatch finished, or an abandoned
        collecting job removed by staged-content cleanup. Recipients without a
        message are never sent.
  transitions:
    collecting: [queued, cancelled]
    queued: [processing, failed, cancelled]
    processing: [dispatched, failed, cancelled]
    dispatched: [completed]

message_class:
  description: send_jobs.message_class (D-20).
  values:
    transactional:
      origin: spec
      meaning: Individually triggered mail. unsubscribe_url and list_id are not accepted in v1.
    subscription:
      origin: spec
      meaning: >-
        Newsletter/marketing mail. list_id is mandatory and every recipient
        must carry a client-generated HTTPS unsubscribe_url; Go adds
        List-Unsubscribe, List-Unsubscribe-Post and List-Id headers.

# ---------------------------------------------------------------------------
# Validation result model
# ---------------------------------------------------------------------------
# Status columns are NULL until the address has been processed. Once processed
# every status column is non-NULL; a stage that was not executed records `skipped`.

validation_processing_state:
  description: Internal work state of one validation address (not exposed by the API).
  values:
    pending: {origin: contract, meaning: Not yet claimed.}
    claimed: {origin: contract, meaning: Leased by a validator worker until lease_expires_at.}
    retry_scheduled: {origin: contract, meaning: Temporary condition; eligible again at next_attempt_at.}
    done: {origin: contract, meaning: Final result recorded.}

syntax_status:
  values:
    valid: {origin: contract, meaning: Parses as an RFC 5321/5322 mailbox usable for SMTP.}
    invalid: {origin: contract, meaning: Malformed; no network checks are performed.}

domain_status:
  values:
    mx: {origin: contract, meaning: One or more usable MX records.}
    null_mx: {origin: contract, meaning: 'RFC 7505 Null MX ("MX 0 ."); the domain accepts no mail.'}
    address_fallback: {origin: contract, meaning: "No MX, but A/AAAA records permit RFC 5321 implicit-MX delivery."}
    no_mail_host: {origin: contract, meaning: Domain exists but has neither MX nor usable A/AAAA records.}
    nxdomain: {origin: contract, meaning: Authoritative NXDOMAIN.}
    temporary_failure: {origin: contract, meaning: SERVFAIL/timeout/refused. Never a permanent verdict on first occurrence.}
    invalid_response: {origin: contract, meaning: Malformed or unusable DNS response.}
    skipped: {origin: contract, meaning: Not evaluated because an earlier stage was decisive.}

smtp_status:
  values:
    accepted: {origin: contract, meaning: "RCPT TO answered 2xx. Evidence, not proof of a human mailbox."}
    rejected: {origin: contract, meaning: "Mailbox-level permanent rejection (5xx on RCPT, e.g. 5.1.1)."}
    temporary_failure: {origin: contract, meaning: "4xx at any stage, including suspected greylisting."}
    blocked: {origin: contract, meaning: The probe itself was refused by policy; says nothing about the mailbox.}
    timeout: {origin: contract, meaning: Connection or command timeout.}
    connection_failed: {origin: contract, meaning: Connection refused/unreachable on all candidate hosts.}
    inconclusive: {origin: contract, meaning: Unexpected or ambiguous protocol behaviour.}
    skipped: {origin: contract, meaning: "Not probed (earlier stage decisive, probing disabled, or domain policy)."}

overall_classification:
  values:
    deliverable: {origin: spec}
    probably_deliverable: {origin: spec}
    undeliverable: {origin: spec}
    temporarily_unverifiable: {origin: spec}
    unknown: {origin: spec}
    risky: {origin: spec}

confidence_level:
  description: >-
    validation_addresses.confidence and suggestion_confidence (D-04). Categorical;
    never presented as a probability.
  values:
    low: {origin: spec}
    medium: {origin: spec}
    high: {origin: spec}

typo_reason_code:
  description: validation_addresses.suggestion_reason_code (D-04). A suggestion never modifies an address.
  values:
    provider_domain_edit_distance: {origin: spec, meaning: Small edit distance from a known mailbox-provider domain.}
    transposition: {origin: spec, meaning: Adjacent-character transposition of a known domain.}
    tld_typo: {origin: spec, meaning: "Likely top-level-domain error (e.g. .con, .cmo)."}
    legacy_domain_alias: {origin: spec, meaning: "Known, explicitly maintained legacy alias."}
    other_domain_typo_rule: {origin: spec, meaning: "Another recognised, documented domain typo rule."}

validation_evidence_type:
  values:
    dns_mx: {origin: contract}
    dns_address: {origin: contract}
    smtp_connect: {origin: contract}
    smtp_ehlo: {origin: contract}
    smtp_mail_from: {origin: contract}
    smtp_rcpt_to: {origin: contract}
    smtp_accept_all_probe: {origin: contract, meaning: RCPT for a random non-existent local part on the same domain.}

# ---------------------------------------------------------------------------
# Messages
# ---------------------------------------------------------------------------

message_status:
  description: >-
    messages.current_status: a projection of message_events. A new event
    changes current_status only to a status of higher `rank`, so out-of-order
    arrival cannot regress state. failed and suppressed are reachable only
    from created/queued. `terminal` statuses are terminal knowledge states
    and count towards send-job completion.
  values:
    created: {origin: spec, rank: 10, terminal: false, meaning: Message row created by Go from a send_job_recipient.}
    queued: {origin: spec, rank: 20, terminal: false, meaning: Waiting in Go for a pacing slot; not yet in Postfix.}
    submitted: {origin: spec, rank: 30, terminal: false, meaning: Postfix accepted the submission; queue id recorded.}
    deferred: {origin: spec, rank: 40, terminal: false, meaning: Postfix reported a temporary failure and will retry.}
    outcome_unknown:
      origin: spec
      rank: 45
      terminal: true
      meaning: >-
        Reconciliation found the queue id gone from Postfix without any
        recoverable authoritative outcome. Smarthost cannot determine the final
        SMTP result. NOT a delivery-success state. Any later authoritative
        transport event or DSN supersedes it (higher rank).
    remote_accepted:
      origin: spec
      rank: 50
      terminal: true
      meaning: >-
        The receiving SMTP system accepted responsibility for the message.
        NOT proof of inbox placement, human receipt or reading.
    soft_bounced:
      origin: spec
      rank: 60
      terminal: true
      meaning: Final failure of a temporary nature (expiry or 4.x.x failed DSN).
    hard_bounced: {origin: spec, rank: 70, terminal: true, meaning: "Permanent failure (5.x.x), synchronous or by DSN."}
    complained: {origin: spec, rank: 80, terminal: true, meaning: A complaint was attributed to this message.}
    failed: {origin: spec, rank: 90, terminal: true, meaning: Immediate submission failure; never handed to Postfix.}
    suppressed:
      origin: spec
      rank: 90
      terminal: true
      meaning: Deliberately not submitted because an active suppression matched.
  resolved_at_rule: >-
    messages.resolved_at is set the first time the message enters a terminal
    status and is never changed afterwards.

message_event_type:
  description: >-
    message_events.event_type. Append-only. `sets_status` is the status the
    event moves the message to (subject to rank); null means informational.
    `sources` lists the event_source values that may produce it.
  values:
    message_created: {origin: spec, sets_status: created, sources: [delivery_daemon]}
    message_queued: {origin: spec, sets_status: queued, sources: [delivery_daemon]}
    message_suppressed:
      origin: spec
      sets_status: suppressed
      sources: [delivery_daemon]
      meaning: An active suppression matched; metadata_json carries the suppression id and reason.
    submission_failed:
      origin: spec
      sets_status: failed
      sources: [delivery_daemon, postfix_submission]
      meaning: Postfix permanently refused the submission, or an unrecoverable build error occurred.
    submitted_to_postfix:
      origin: spec
      sets_status: submitted
      sources: [postfix_submission, postfix_log]
      meaning: >-
        Postfix accepted the message; queue id from the SMTP reply, or recovered
        from the log after an ambiguous submission.
    postfix_queued: {origin: spec, sets_status: null, sources: [postfix_log], meaning: Postfix log confirms the queue entry.}
    delivery_attempt: {origin: spec, sets_status: null, sources: [postfix_log], meaning: Postfix re-attempted a deferred message.}
    deferred:
      origin: spec
      sets_status: deferred
      sources: [postfix_log, dsn_spool, unmatched_dsn_resolution]
      meaning: Postfix status=deferred or a DELAY DSN.
    connection_failure:
      origin: spec
      sets_status: deferred
      sources: [postfix_log, dsn_spool, unmatched_dsn_resolution]
      meaning: Attempt failed at TCP/TLS level (Postfix log, or a DELAY DSN whose failure scope is connection).
    remote_accepted: {origin: spec, sets_status: remote_accepted, sources: [postfix_log], meaning: Postfix status=sent.}
    soft_bounce:
      origin: spec
      sets_status: soft_bounced
      sources: [postfix_log, dsn_spool, unmatched_dsn_resolution]
      meaning: >-
        Final failure of a temporary nature. With failure_scope recipient it counts towards the
        global repeated_soft_bounce rule (D-18, D-30).
    hard_bounce:
      origin: spec
      sets_status: hard_bounced
      sources: [postfix_log, dsn_spool, unmatched_dsn_resolution]
      meaning: >-
        Permanent failure. With failure_scope recipient it creates a global hard_bounce
        suppression (D-30); other scopes never do.
    complaint:
      origin: spec
      sets_status: complained
      sources: [dsn_spool, unmatched_dsn_resolution]
      meaning: >-
        An ARF complaint correlated to this exact message. Creates a global complaint
        suppression (D-30).
    transport_outcome_unknown:
      origin: spec
      sets_status: outcome_unknown
      sources: [queue_reconciliation]
      meaning: >-
        Explicit reconciliation event (D-27): the queue id was absent from more
        than one Postfix queue snapshot after the grace interval and no
        authoritative outcome could be recovered from logs or DSNs.
    open_recorded:
      origin: spec
      sets_status: null
      sources: [tracking_endpoint]
      meaning: Tracking pixel fetched. A recorded open, not a proven read.
    click_recorded:
      origin: spec
      sets_status: null
      sources: [tracking_endpoint]
      meaning: Tracked link followed; metadata_json carries link_index.
    dsn_unmatched:
      origin: spec
      sets_status: null
      sources: [dsn_spool]
      meaning: >-
        A DSN partially correlated to this message whose recipient/status could
        not be reconciled. DSNs matching no message go to unmatched_dsns.

event_source:
  description: >-
    message_events.event_source (D-06). Uniqueness of (event_source,
    source_event_key) is enforced whenever source_event_key is not null.
    De-duplication never derives from event content alone.
  values:
    delivery_daemon:
      origin: spec
      key_rule: "<event_type>:<message_id> (each lifecycle event happens once per message)"
    postfix_submission:
      origin: spec
      key_rule: "<message_id>:<postfix_queue_id>"
    postfix_log:
      origin: spec
      key_rule: >-
        "<log_generation_id>:<record_position>" — the SHA-256 fingerprint of the
        generation's first record plus the record's byte position in the
        uncompressed generation (verified in Phase 1; see postfix-integration §8 V-1)
    dsn_spool:
      origin: spec
      key_rule: "<Maildir unique file name> (stable across claim, retry and restart)"
    unmatched_dsn_resolution:
      origin: spec
      key_rule: "<unmatched_dsn_id>"
    queue_reconciliation:
      origin: spec
      key_rule: "<message_id>:<postfix_queue_id>"
    tracking_endpoint:
      origin: spec
      key_rule: null (repeated opens/clicks are legitimate distinct events)
  event_metadata: >-
    DSN-derived events (dsn_spool, unmatched_dsn_resolution) carry metadata_json.correlation
    (verp | envelope_id | message_id | queue_id | operator), the DSN action,
    reporting_mta and the spool key; complaint events carry the ARF feedback_type.

failure_scope:
  description: >-
    message_events.failure_scope, set by Go's classifier on deferred,
    connection_failure, soft_bounce and hard_bounce events (D-18). One
    classifier serves Postfix log and DSN evidence. Only `recipient` soft
    bounces count towards repeated_soft_bounce suppression, and only
    `recipient` hard bounces create a hard_bounce suppression (D-30).
  values:
    recipient: {origin: spec, meaning: "Mailbox-specific condition (e.g. 5.1.1 unknown mailbox, 4.2.2 mailbox full, 4.2.1 mailbox disabled)."}
    domain: {origin: spec, meaning: General domain-level deferral.}
    provider_policy: {origin: spec, meaning: Provider-wide rate limiting or policy/reputation deferral.}
    connection: {origin: spec, meaning: TCP/TLS connection failure.}
    dns: {origin: spec, meaning: DNS resolution failure for the destination.}
    infrastructure: {origin: spec, meaning: Temporary remote or local infrastructure failure.}
    unknown: {origin: spec, meaning: Not classifiable.}

dsn_classification:
  values:
    hard_bounce: {origin: spec, message_event: hard_bounce}
    soft_bounce: {origin: spec, message_event: soft_bounce}
    deferred: {origin: spec, message_event: deferred}
    connection_failure: {origin: spec, message_event: connection_failure}
    complaint: {origin: spec, message_event: complaint}
    malformed_or_unmatched_dsn: {origin: spec, message_event: dsn_unmatched}

unmatched_dsn_status:
  description: >-
    unmatched_dsns.status (D-05). Rows are retained after resolution. match_requested
    returns to open when Go cannot interpret the DSN for the requested message (the
    reason is kept in detail_json).
  values:
    open: {origin: spec, meaning: Awaiting operator investigation.}
    match_requested: {origin: spec, meaning: Operator identified the candidate message; queued for Go.}
    matched: {origin: spec, meaning: Go interpreted the DSN and created the transport event.}
    dismissed: {origin: spec, meaning: "Operator decided no message applies; a written reason (resolution_note) is required."}
  transitions:
    open: [match_requested, dismissed]
    match_requested: [matched, open]

# ---------------------------------------------------------------------------
# Tenancy, identity, domains
# ---------------------------------------------------------------------------

client_status:
  description: >-
    clients.status (D-31; lifecycle since specification 2.10). Changes only through the audited
    client lifecycle service, with an operator note; the transitions below are the only ones.
  values:
    pending_approval: {origin: contract, terminal: false, meaning: "Registered (operator record or application); awaiting operator approval. Authenticates and reads; creates no work."}
    active: {origin: contract, terminal: false, meaning: Approved for operation within its limits.}
    throttled: {origin: contract, terminal: false, meaning: "Operator-imposed reduced pace: delivery paced at DELIVERY_THROTTLED_CLIENT_RATE_PER_MINUTE and API requests at APP_THROTTLED_CLIENT_API_RATE_PER_MINUTE; may still create work."}
    suspended: {origin: contract, terminal: false, meaning: Job creation refused; workers do not claim or continue its work.}
    closed: {origin: contract, terminal: true, meaning: "Final: API keys fail authentication, no work runs; data is retained."}
  transitions:
    pending_approval: [active, closed]
    active: [throttled, suspended, closed]
    throttled: [active, suspended, closed]
    suspended: [active, throttled, closed]

client_origin:
  description: clients.origin (specification 2.10).
  values:
    operator: {origin: contract, meaning: Created by an operator (dashboard or console).}
    public_application: {origin: contract, meaning: "Created through a public application channel; only while APP_PUBLIC_ONBOARDING_ENABLED is true, always pending_approval."}

quota_metric:
  description: client_quota_usage.metric - admitted work counted against client_limits (specification 2.10).
  values:
    validation_jobs: {origin: contract, meaning: Validation jobs created.}
    validation_addresses: {origin: contract, meaning: Addresses submitted in created validation jobs.}
    send_jobs: {origin: contract, meaning: Send jobs created.}
    send_recipients: {origin: contract, meaning: Recipients accepted in recipient batches.}

quota_period:
  description: client_quota_usage.period - UTC calendar periods (specification 2.10).
  values:
    day: {origin: contract}
    month: {origin: contract}

policy_acceptance_source:
  description: client_policy_acceptances.source (specification 2.10).
  values:
    client_dashboard: {origin: contract, meaning: A client admin accepted the policy version in the dashboard.}
    operator_recorded: {origin: contract, meaning: "An operator recorded an acceptance made elsewhere (e.g. a signed agreement), with a reference."}

sending_domain_status:
  description: sending_domains.status (D-13).
  values:
    pending: {origin: spec, meaning: Verification token issued; TXT challenge not yet matched.}
    verified: {origin: spec, meaning: TXT challenge matched; verified_at set.}
    disabled: {origin: spec, meaning: Disabled by an operator or the client; not usable for sending.}

dkim_status:
  description: sending_domains.dkim_status (D-13, D-26).
  values:
    not_configured: {origin: spec}
    pending_dns: {origin: spec, meaning: Key pair provisioned in OpenDKIM; public key not yet confirmed in DNS.}
    active: {origin: spec, meaning: OpenDKIM signs for this domain.}
    disabled: {origin: spec}

user_status:
  values:
    active: {origin: contract}
    disabled: {origin: contract, meaning: Cannot log in; memberships retained for audit.}

client_membership_role:
  description: client_memberships.role (D-12), enforced with Symfony voters per client.
  values:
    admin: {origin: contract, meaning: "Manages API keys, sending domains, webhook endpoints and members."}
    member: {origin: contract, meaning: Creates and inspects validation and send jobs.}
    viewer: {origin: contract, meaning: Read-only access.}

# ---------------------------------------------------------------------------
# Suppression, usage, webhooks, audit
# ---------------------------------------------------------------------------

suppression_reason:
  description: >-
    suppressions.reason. D-30: hard_bounce, complaint and repeated_soft_bounce are created
    only by Go, globally (client_id NULL); recipient_global_opt_out only by a client with
    can_submit_global_suppressions through the API; operator_block and client_abuse_block
    only by an operator. A client can never create any reason other than recipient_global_opt_out.
  values:
    hard_bounce: {origin: spec, lifetime: indefinite, meaning: "Recipient-specific permanent failure (failure_scope recipient)."}
    complaint: {origin: spec, lifetime: indefinite, meaning: An ARF complaint correlated to an exact message.}
    repeated_soft_bounce:
      origin: spec
      lifetime: temporary
      meaning: >-
        DELIVERY_SOFT_BOUNCE_SUPPRESSION_THRESHOLD consecutive recipient-scope soft bounces of
        the address within the window, across all clients; expires after
        DELIVERY_SOFT_BOUNCE_SUPPRESSION_WINDOW_DAYS.
    operator_block: {origin: spec, lifetime: indefinite unless the operator sets an expiry}
    client_abuse_block: {origin: spec, lifetime: indefinite unless the operator sets an expiry}
    recipient_global_opt_out:
      origin: spec
      lifetime: indefinite
      meaning: >-
        The recipient explicitly asked not to receive email from any source using this
        Smarthost installation, reported by a trusted client (source_client_id). Never an
        ordinary list, newsletter, campaign or client unsubscribe.

global_suppression_request_operation:
  description: >-
    global_suppression_requests.operation (D-38): the idempotent client operation an
    Idempotency-Key was used for. Lifting is naturally idempotent and records no request row.
  values:
    create_global_opt_out: {origin: contract, meaning: "POST /v1/global-suppressions (201 created, or 200 when this client's opt-out of the address was already active)."}

suppression_scope_type:
  values:
    address: {origin: contract, meaning: "Matches the D-18 normalised address (local part preserved, domain lower-cased)."}
    domain: {origin: contract, meaning: "Matches every address at the lower-cased domain. Operator-created only."}

usage_type:
  values:
    validation_address: {origin: contract, meaning: One address reached a final validation result.}
    message_submitted: {origin: contract, meaning: One message accepted into Postfix.}

usage_reference_type:
  values:
    validation_job: {origin: contract}
    send_job: {origin: contract}
    message: {origin: contract}

webhook_event_type:
  values:
    validation.completed: {origin: spec}
    validation.failed: {origin: spec}
    send.completed: {origin: spec}
    send.failed: {origin: spec}
    message.hard_bounced: {origin: spec}
    message.complained: {origin: spec}
    webhook.test: {origin: contract, meaning: Emitted only by POST /v1/webhooks/test.}
    repermission.responded: {origin: contract, meaning: "A recipient answered a re-permission message (confirmed, unsubscribed from this list, or global opt-out) (specification 2.11)."}

webhook_subject_type:
  values:
    validation_job: {origin: contract}
    send_job: {origin: contract}
    message: {origin: contract}
    webhook_endpoint: {origin: contract, meaning: Subject of webhook.test.}
    address_batch_entry: {origin: contract, meaning: Subject of repermission.responded (specification 2.11).}

webhook_endpoint_status:
  values:
    enabled: {origin: contract}
    disabled: {origin: contract}

webhook_delivery_status:
  values:
    pending: {origin: contract, meaning: Awaiting first attempt or a retry at next_attempt_at.}
    delivered: {origin: contract, meaning: Endpoint answered 2xx.}
    failed: {origin: contract, meaning: Retry limit exhausted; visible on the operator dashboard.}

billing_statement_status:
  description: billing_statements.status - the provider-neutral billing boundary (specification 2.10).
  values:
    draft: {origin: contract, terminal: false, meaning: Totals prepared from usage_records; may be recomputed.}
    finalized: {origin: contract, terminal: false, meaning: Totals frozen for the external billing system.}
    exported: {origin: contract, terminal: true, meaning: "Taken over by the external billing system (external_reference set)."}
    void: {origin: contract, terminal: true, meaning: Withdrawn; a new statement may be prepared for the period.}
  transitions:
    draft: [finalized, void]
    finalized: [exported, void]

billing_reconciliation_status:
  description: billing_statements.reconciliation_status (specification 2.10).
  values:
    consistent: {origin: contract, meaning: "Usage records agree with the authoritative jobs and messages, and the statement totals with the usage records."}
    inconsistent: {origin: contract, meaning: Reconciliation found a difference; the findings are in reconciliation_json.}

client_alert_metric:
  description: client_alerts.metric - reputation signals with operator thresholds (specification 2.10).
  values:
    hard_bounce_rate: {origin: contract, meaning: Messages with a hard bounce / messages submitted in the window (percent).}
    complaint_rate: {origin: contract, meaning: Messages with a complaint / messages submitted in the window (percent).}
    deferral_rate: {origin: contract, meaning: Messages deferred or soft-bounced / messages submitted in the window (percent).}
    volume_increase: {origin: contract, meaning: Messages submitted in the last 24 hours / the daily average of the 7 days before (a factor).}

client_alert_severity:
  description: client_alerts.severity (specification 2.10).
  values:
    warning: {origin: contract}
    critical: {origin: contract}

audit_actor_type:
  values:
    user: {origin: contract, meaning: A dashboard user (users.id).}
    api_key: {origin: contract}
    system: {origin: contract, meaning: Workers and scheduled processes.}

# ---------------------------------------------------------------------------
# Operator self-service and address batches (specification 2.11)
# ---------------------------------------------------------------------------

system_request_action:
  description: system_requests.action - work the web application asks of the host agent.
  values:
    diagnostics.run: {origin: contract, meaning: "Run the host-side checks (the production preflight and host facts) and record the results."}
    delivery.pause: {origin: contract, meaning: "Hold the Postfix queue (the audited emergency pause); the delivery daemon already stopped through delivery_controls."}
    delivery.resume: {origin: contract, meaning: "Release the Postfix queue after the emergency stop was lifted."}
    delivery.live_enable: {origin: contract, meaning: "Run the activation preflight and, if it passes, enable live delivery (smarthostctl prod live-enable)."}
    delivery.live_disable: {origin: contract, meaning: "Return to held mode (smarthostctl prod live-disable)."}
    backup.run: {origin: contract, meaning: "Take a backup now, prune old ones and copy it off the host if configured."}
    backup.restore_rehearsal: {origin: contract, meaning: "Restore the newest backup into a temporary database, verify it and drop it again."}
    dkim.generate: {origin: contract, meaning: "Generate a new DKIM key for a domain and selector (not yet signing)."}
    dkim.activate: {origin: contract, meaning: "Activate a published DKIM selector after its DNS record matches the key."}
    tls.renew: {origin: contract, meaning: "Obtain or renew the Let's Encrypt certificate (DNS-01) and install it."}

system_request_status:
  description: system_requests.status.
  values:
    pending: {origin: contract}
    running: {origin: contract, meaning: "Claimed by the host agent."}
    succeeded: {origin: contract}
    failed: {origin: contract, meaning: "The action ran and failed; result_summary says why."}
    cancelled: {origin: contract, meaning: "Withdrawn before the agent claimed it."}

system_component:
  description: system_checks.component and system_check_runs.component - the part of the system a check covers.
  values:
    host: {origin: contract, meaning: "The Ubuntu host, Podman, the service user, disk, memory, clock."}
    boot: {origin: contract, meaning: "Automatic start after a reboot (lingering, units, the ingress socket)."}
    database: {origin: contract, meaning: "PostgreSQL, migrations, grants."}
    web: {origin: contract, meaning: "The Catto-mail Web Application (Symfony)."}
    validator: {origin: contract, meaning: "The Catto-mail Email Validator (Python)."}
    delivery: {origin: contract, meaning: "The Catto-mail Delivery Daemon (Go)."}
    postfix: {origin: contract, meaning: "The Postfix Mail Transfer Agent."}
    opendkim: {origin: contract, meaning: "The OpenDKIM Signing Service."}
    dns: {origin: contract, meaning: "Public DNS records (A, PTR, MX, SPF, DKIM, DMARC)."}
    tls: {origin: contract, meaning: "HTTPS and SMTP certificates."}
    nginx: {origin: contract, meaning: "The nginx Frontend and the ingress socket."}
    tracking: {origin: contract, meaning: "Open and click tracking endpoints."}
    webhook: {origin: contract, meaning: "The Catto-mail Webhook Worker."}
    bounce: {origin: contract, meaning: "The bounce path (inbound SMTP, DSN spool, parsing, suppression)."}
    backup: {origin: contract, meaning: "Backups, off-host copies and restore rehearsals."}
    security: {origin: contract, meaning: "Exposure, relay protection, file modes, secrets."}

system_check_result:
  description: system_checks.result and system_check_runs.result.
  values:
    pass: {origin: contract}
    warn: {origin: contract, meaning: "Works, but needs attention."}
    fail: {origin: contract, meaning: "Does not work, or is unsafe."}
    skipped: {origin: contract, meaning: "Not run (a prerequisite is missing, or it does not apply)."}
    info: {origin: contract, meaning: "A fact, not a judgement."}

system_check_source:
  description: system_checks.source and system_check_runs.source.
  values:
    agent: {origin: contract, meaning: "The host agent (host, systemd, DNS, TLS, Postfix, backups)."}
    application: {origin: contract, meaning: "The web application itself (database, workers, tracking)."}

system_check_trigger:
  description: system_check_runs.run_trigger - why a result was kept in the history.
  values:
    scheduled: {origin: contract, meaning: "The first scheduled result of the check on a UTC day."}
    requested: {origin: contract, meaning: "An administrator asked for the run."}
    changed: {origin: contract, meaning: "The result differs from the previous one."}

setup_step_state:
  description: setup_steps.state (no row = not done yet).
  values:
    done: {origin: contract}
    skipped: {origin: contract, meaning: "The administrator chose to come back later."}

address_batch_purpose:
  description: address_batches.purpose.
  values:
    validation: {origin: contract, meaning: "Validate and review a list; sending is for seed and controlled tests only."}
    repermission: {origin: contract, meaning: "Ask the people on an old list whether they still want mail (confirm, unsubscribe, global opt-out)."}

address_batch_file_format:
  description: address_batches.file_format.
  values:
    txt: {origin: contract, meaning: "One address per line."}
    csv: {origin: contract, meaning: "Comma-separated with a header row; one column holds the address."}

address_batch_entry_outcome:
  description: address_batch_entries.outcome - what the import did with an input row. No row is ever dropped.
  values:
    imported: {origin: contract, meaning: "A new address of this batch."}
    duplicate: {origin: contract, meaning: "The same normalised address appeared on an earlier row (duplicate_of_entry_id)."}
    malformed: {origin: contract, meaning: "The row cannot be an e-mail address at all (no @, control characters, too long); not validated."}

consent_state:
  description: >-
    address_batch_entries.consent_state - what the recipient told us through a re-permission
    message. The subscription itself belongs to the client application; this records the
    evidence and is forwarded with repermission.responded.
  values:
    unknown: {origin: contract, meaning: "No re-permission message sent."}
    unconfirmed: {origin: contract, meaning: "A re-permission message was sent; no answer yet."}
    confirmed: {origin: contract, meaning: "The recipient confirmed they want to stay subscribed."}
    unsubscribed: {origin: contract, meaning: "The recipient left this list (the client's own unsubscribe; not a Smarthost suppression)."}
    global_opt_out: {origin: contract, meaning: "The recipient asked for no mail through this Smarthost at all (a global recipient_global_opt_out suppression)."}

batch_review_decision:
  description: address_batch_entries.review_decision - the administrator's decision on a result that needs review.
  values:
    include: {origin: contract, meaning: "Send to it despite a risky, unknown or temporarily unverifiable result."}
    exclude: {origin: contract, meaning: "Never send to it from this batch."}

typo_decision:
  description: address_batch_entries.typo_decision - the administrator's decision on a typo suggestion. An address is never corrected automatically.
  values:
    accepted: {origin: contract, meaning: "The suggested address replaces this one; it is added as a correction entry and validated."}
    rejected: {origin: contract, meaning: "The address stays as entered."}

batch_send_stage:
  description: address_batch_sends.stage - the rollout stage of a send created from a batch.
  values:
    seed: {origin: contract, meaning: "A handful of addresses the operator owns."}
    controlled: {origin: contract, meaning: "A small known-good sample of the batch."}
    rollout: {origin: contract, meaning: "A further portion, while bounces, complaints and deferrals are watched."}
    full: {origin: contract, meaning: "Every remaining eligible address."}

# Operator-facing address states, derived (not stored). Each is a separate dimension: one
# address can be syntactically valid, unconfirmed, eligible for a seed test, later hard
# bounced and globally suppressed. The dashboard and the help pages use these names.
operator_address_states:
  validation_result:
    derived_from: validation_addresses (processing_state, overall_classification)
    derived_values:
      pending: Not validated yet (or still being validated).
      valid: "deliverable or probably_deliverable: the domain accepts mail and nothing contradicts the mailbox. Evidence, never proof of a reading human."
      invalid: "undeliverable: bad syntax, a domain that does not exist or accepts no mail, or a mailbox the server rejected."
      risky: "risky: accept-all domain, disposable domain, or a high-confidence typo."
      unknown: "unknown: the evidence is ambiguous (probe blocked, invalid DNS answer, address literal)."
      temporary_failure: "temporarily_unverifiable: DNS or SMTP kept failing temporarily until the retries ran out."
  validation_flags:
    derived_from: validation_addresses (is_domain_typo_suspected, is_disposable, is_role, is_catch_all_or_accept_all)
    derived_values:
      typo_suspected: The domain looks like a typo; a suggestion is shown, never applied automatically.
      disposable: A known disposable-address domain.
      role_account: A role mailbox such as info@ or sales@.
      accept_all: The server accepts any recipient on this domain.
  send_eligibility:
    derived_from: validation result, review and typo decisions, consent, active suppressions
    derived_values:
      eligible: Valid (or included after review), not suppressed, not unsubscribed.
      pending_review: Pending, risky, unknown, temporary failure, or an undecided typo suggestion.
      blocked_invalid: Invalid or malformed.
      blocked_hard_bounce: An active hard-bounce suppression.
      blocked_complaint: An active complaint suppression.
      blocked_suppressed: Another active suppression (repeated soft bounces, operator block, global opt-out).
      blocked_unsubscribed: The recipient unsubscribed from this list through a re-permission message.
      excluded: Excluded by the administrator, or replaced by an accepted typo correction.
  delivery_state:
    derived_from: messages.current_status (message_status)
    derived_values:
      not_sent: No message from this batch.
      created: Created by the delivery daemon.
      queued: Waiting for a pacing slot.
      submitted: Accepted by Postfix for delivery.
      deferred: Temporarily refused; Postfix retries.
      remote_accepted: The receiving server accepted responsibility. Not proof of inbox placement or reading.
      soft_bounced: Finally refused for a temporary reason.
      hard_bounced: Permanently refused.
      complained: The recipient reported it as spam.
      suppressed: Not sent because of a suppression.
      failed: Could not be submitted.
      outcome_unknown: The outcome could not be determined; never counted as delivered.
  engagement_state:
    derived_from: message_events (open_recorded, click_recorded)
    derived_values:
      not_opened: No recorded open; the message may still have been read (images blocked).
      open_observed: The tracking image was fetched - by the person, a mail client, a privacy proxy or a scanner.
      clicked: A tracked link was followed.
