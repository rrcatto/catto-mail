        - stage
        - recipient_count
        - subject
        - created_by_user_id
        - created_at
  indexes_required:
    - validation_addresses.job_id
    - validation_addresses.normalized_address
    - messages.send_job_id
    - messages.verp_token_unique
    - messages.postfix_queue_id
    - message_events.message_id_occurred_at
    - suppressions.address_or_domain_scope
    - suppressions.global_address_reason_active_unique
    - global_suppression_requests.client_id_operation_idempotency_key_unique
    - suppressions.source_client_id_address_active_opt_out_unique
    - messages.recipient_address
    - api_keys.key_hash_unique
    - send_jobs.client_id_status
    - validation_jobs.client_id_status
    - send_job_recipients.send_job_id
    - send_job_recipients.send_job_id_normalized_address_unique
    - send_job_recipient_batches.send_job_id_idempotency_key_unique
    - messages.send_job_recipient_id_unique
    - messages.tracking_token_unique
    - message_links.message_id_link_index_unique
    - message_events.event_source_source_event_key_unique
    - unmatched_dsns.status_received_at
    - unmatched_dsns.spool_ingest_key_unique
    - sending_domains.client_id_domain_unique
    - users.email_unique
    - client_memberships.user_id_client_id_unique
    - webhook_endpoints.client_id
    - webhook_deliveries.status_next_attempt_at
  integrity_rules:
    - raw API keys are never stored
    - VERP tokens are unique
    - tracking tokens are unique opaque random values of at least 192 bits
    - message_events are append-only through application policy and database privileges
    - send_job_recipients are immutable once the job leaves collecting, except purging rendered content
    - webhook signing secrets are stored encrypted, never in plaintext
    - external references are client-scoped
    - >-
      suppressions.client_id only scopes a suppression (NULL = global); the client that reported
      a global opt-out is recorded separately in source_client_id (D-30)
    - every tenant-owned row is scoped by client directly or through an enforced parent relation
    - users.email is unique case-insensitively as a login-identity rule; it is never the SMTP mailbox-normalisation rule

security:
  baseline:
    - rootless Podman
    - least-privilege containers
    - least-privilege database roles; no schema-altering privileges for Python or Go
    - secrets outside images and repositories
    - TLS for public API
    - authenticated submission on port 587
    - PostgreSQL not publicly exposed
    - Python and Go not publicly exposed
    - PHP-FPM and OpenDKIM reachable only on the internal network
    - parameterised database access in Go/Python
    - Symfony CSRF protection for browser forms
    - output escaping in dashboard views
    - strict upload limits and file parsing
    - rate limiting per API key/client/IP where appropriate
  email_abuse_controls:
    - manual approval gate before meaningful production volume
    - account suspension and throttling
    - per-client usage limits
    - bounce-rate monitoring
    - complaint-rate monitoring
    - global suppression capability
    - recipient global opt-out reporting only for operator-approved clients (can_submit_global_suppressions)
    - sending-domain verification (DNS TXT challenge)
  dkim:
    - private keys available to OpenDKIM only
    - signing based on verified sending domain and active DKIM configuration
  webhook_security:
    - sign payloads
    - timestamp signatures
    - allow clients to rotate webhook secrets
    - deliver only to public destinations with the resolved address pinned and redirects refused (specification 2.8)
    - store signing secrets encrypted at rest with application-managed keys
  dashboard_authentication:
    - human users authenticate as users through Symfony Security, never with API keys
    - authentication is passwordless (specification 2.7) - a single-use sign-in link emailed to the user's address; only its SHA-256 is stored; it expires after APP_LOGIN_LINK_TTL_SECONDS; requests are limited per address and per client address; the answer never reveals whether an account exists
    - the link is built from SMARTHOST_PUBLIC_BASE_URL, never from a request Host header; HEAD requests (mail scanners) never consume it
    - APP_ADMIN_EMAIL can always request a link; its account is created on first sign-in and receives the ADMIN role at every sign-in
    - installation-wide authorisation uses permission keys (App\Access\PermissionCatalog) granted by roles (roles, role_permissions, user_roles); ADMIN holds every permission and cannot be reduced; SYSTEM.* permissions belong to ADMIN alone; only ADMIN manages roles and grants ADMIN
    - client access comes from client_memberships with a client role, or from the PLATFORM.CLIENT.VIEW / PLATFORM.CLIENT.MANAGE permissions
  tracking_security:
    - no raw recipient email in URLs
    - opaque random tokens of at least 192 bits, validated by format and server-side lookup
    - redirect target must come from server-side stored link mapping
  future_public_saas:
    # Phase 9 (specification 2.10) implements these in the repository; see saas_operations.
    - acceptable use policy (saas_operations.policy_acceptance)
    - abuse reporting (saas_operations.reputation_monitoring; complaints via inbound_bounce_handling)
    - plan/rate enforcement (saas_operations.client_limits)
    - verified sending identities (sending domains, unchanged)
    - client isolation review (saas_operations.tenant_isolation_review)

saas_operations:
  # Phase 9, specification 2.10: public SaaS hardening, repository side. Operator procedures:
  # docs/production/onboarding.md and docs/production/runbook.md.
  principle: >-
    One client model (clients, client_memberships, api_keys) extended for external clients; no
    second account system. Public self-service onboarding stays disabled unless the operator
    enables it; every client is approved by an operator. Monitoring raises alerts for people and
    never acts on a client by itself.
  client_lifecycle:
    statuses:
      pending_approval: authenticates and reads; creates no resource-consuming work; awaits operator review
      active: full use within its limits
      throttled: >-
        a restriction, not a penalty box: the client keeps working, but its API request rate is
        capped by APP_THROTTLED_CLIENT_API_RATE_PER_MINUTE (or its own lower limit) and the Go
        delivery daemon applies DELIVERY_THROTTLED_CLIENT_RATE_PER_MINUTE to its message starts;
        quotas, validation and webhooks are unchanged
      suspended: >-
        the per-client kill switch: authenticates and reads (so the client can see what happened);
        every work-creating API call answers 403; the delivery daemon loses the lease of the
        client's running send jobs at its next lease renewal and starts no new message; the
        validator stops claiming its validation jobs; queued work resumes only after reactivation;
        webhooks about work that already happened are still delivered
      closed: final; API keys no longer authenticate; history is kept for retention and billing
    transitions: >-
      pending_approval -> active (APPROVE) | closed (APPROVE); active -> throttled | suspended
      (RESTRICT); throttled -> active | suspended (RESTRICT); suspended -> active | throttled
      (APPROVE); any non-closed -> closed (APPROVE). Nothing returns to pending_approval; closed
      is final. Every change needs a reason (3-1000 characters), is checked again under a row
      lock and is audited (client.approved, client.throttled, client.suspended,
      client.reactivated, client.unthrottled, client.closed) with from, to and the reason.
    timestamps: status_changed_at, approved_at (first activation), closed_at
    installation_wide_kill_switch: >-
      production_operations (Phase 8): `prod delivery pause` stops all outbound delivery at once;
      it is separate from the per-client suspension.
  public_onboarding_gate: >-
    APP_PUBLIC_ONBOARDING_ENABLED (default and production profile false). No public registration
    route exists in this revision; ClientLifecycle::apply is the single gated entry point that a
    future reviewed workflow would call, and it can only create a pending_approval client with
    origin public_application. Enabling public onboarding is an owner decision recorded in
    docs/production/onboarding.md (stability, reputation, bounce/complaint rates, backup
    evidence, upgrades, abuse procedures, commercial terms, retention).
  policy_acceptance:
    - APP_ACCEPTABLE_USE_POLICY_VERSION names the service-policy version in force (empty = none); Smarthost stores versions and acceptances, never policy text
    - clients.policy_acceptance_required (true for new clients; operator-created active clients and pre-Phase 9 clients are exempt) blocks approval until the version in force is accepted
    - client admins accept in the dashboard (source client_dashboard, the version in force only); operators record an acceptance obtained elsewhere with a reference (source operator_recorded); one row per client and version; audited as client.policy_accepted
  client_metadata: >-
    clients.contact_email, billing_contact_email, abuse_contact_email, origin; operator-only
    private notes in client_notes (never shown to the client, audited as client.note_added).
  client_limits:
    storage: client_limits (one row per client; NULL = no client-specific limit)
    limits:
      - api_requests_per_minute (per client, in addition to the per-key limit)
      - validation_jobs_per_day, validation_addresses_per_day, validation_addresses_per_month
      - send_jobs_per_day, send_recipients_per_day, send_recipients_per_month
      - max_recipients_per_send_job (1-10000, never above the installation maximum)
      - max_api_keys, max_webhook_endpoints, max_sending_domains (usable or non-deleted resources)
    ceilings: >-
      Installation ceilings (APP_CLIENT_API_KEY_LIMIT, APP_CLIENT_WEBHOOK_ENDPOINT_LIMIT,
      APP_CLIENT_SENDING_DOMAIN_LIMIT, the API rate and recipient-per-job maxima) always apply; a
      client limit can only lower them. Volume quotas have no installation ceiling.
    enforcement: >-
      Volume quotas are counters in client_quota_usage per client, metric, period (day, month;
      calendar periods of the installation's time zone, APP_TIMEZONE) admitted with a single INSERT ... ON CONFLICT DO UPDATE ... RETURNING inside the
      transaction that creates the work, so concurrent requests can never jointly exceed a quota
      and a rolled-back request releases its admission. Recipients are counted when added to a
      send job. Count limits (keys, endpoints, domains) are re-checked under a row lock on the
      client. A refusal is 429 quota-exceeded with Retry-After (the next period start) and a
      `quota` member (metric, period, limit, used, requested, resets_at) naming only the client's
      own figures; the API rate limit stays 429 rate-limited. Changes are audited as
      client.limits_changed with before and after.
  api_key_lifecycle: >-
    Keys have a name, an optional expiry (api_keys.expires_at), last_used_at and revoked_at; the
    secret is shown exactly once at creation (no-store response) and only its hash is kept.
    Expired or revoked keys never authenticate. Rotation is create-new, deploy, revoke-old.
    Client admins manage their own keys in the dashboard; operators with
    PLATFORM.CLIENT_KEY.MANAGE manage any client's. Audited: api_key.created, api_key.revoked.
  usage_and_billing:
    metering: >-
      usage_records stays the single metering source: validation_address units per validation
      job (written by the validator) and one message_submitted unit per message accepted by
      Postfix (written by the Go daemon); usage_records_message_once_uq guarantees at most one
      unit per message.
    periods: current_day, current_month, previous_month, custom (dates in APP_TIMEZONE, at most 366 days); daily breakdowns
    reconciliation: >-
      smarthost:usage:reconcile (and the operator usage page) compares metered units with
      validation jobs (done addresses) and accepted messages for a client and period; findings:
      validation_usage_mismatch, validation_usage_without_job, validation_usage_wrong_client,
      usage_wrong_reference, message_usage_invalid, message_without_usage. Exit status 1 when
      inconsistent.
    billing_boundary: >-
      Provider-neutral. billing_statements (draft, finalized, exported, void) with
      billing_statement_lines per usage type freeze the quantities of an ended period; a
      statement is finalized only after a consistent reconciliation with unchanged totals;
      exported needs an external reference; void needs a reason; at most one non-void
      statement per client and period. Smarthost holds no prices, currencies, taxes, invoices
      or payment data, and no billing provider is chosen. Audited:
      billing_statement.prepared/finalized/exported/voided.
    export: >-
      smarthost:usage:export and the operator usage page: deterministic JSON or CSV per client
      and period (categories, reconciliation status, statement status); audited as
      usage.exported.
  reputation_monitoring:
    evaluation: >-
      smarthost:reputation evaluate (production timer <instance>-reputation-evaluate.timer,
      every 15 minutes; an advisory lock serialises runs) computes per client and window (24
      hours, 7 days) messages submitted, validation addresses, hard and soft bounces, deferrals,
      provider-policy failures, complaints, suppressions and unknown outcomes, counting each
      message at most once per kind, into client_reputation_metrics.
    alerts: >-
      client_alerts per client, metric (hard_bounce_rate, complaint_rate, deferral_rate,
      volume_increase), window and severity (warning, critical) with numerator, denominator,
      value and threshold. Rates need at least APP_REPUTATION_MIN_MESSAGES messages; the
      volume increase compares the last 24 hours with the daily average of the 7 days before.
      An open alert is updated in place, resolved when the metric recovers, and an escalation
      to critical clears its acknowledgement. Operators acknowledge with a note
      (client_alert.acknowledged).
    no_automatic_action: >-
      Alerts never change a client's status or limits; the operator decides (throttle, suspend,
      contact). Thresholds: APP_REPUTATION_* in the environment contract.
  webhook_hardening: >-
    In addition to webhooks.delivery_contract: per-client endpoint limit, endpoint health in both
    dashboards (deliveries of the last 7 days, last success and failure, permanent failures
    since the last success), response-header and connect-time bounds.
  client_documentation: >-
    The public integration guide (docs/api/integration-guide.md) and the OpenAPI contract are
    served at /docs/api without authentication. They state that remote_accepted is not inbox
    delivery, open_recorded is not proof of reading, validation is not consent, and an ordinary
    unsubscribe is the client's own state, not a Smarthost global suppression.
  tenant_isolation_review: >-
    Every Phase 9 table is tenant-scoped (client_limits, client_quota_usage,
    client_policy_acceptances, billing_statements and their lines) or operator-only and denied
    by the tenant filter (client_notes, client_reputation_metrics, client_alerts). Proven with
    two clients through the API and the dashboard (Phase9TenantIsolationTest).
  permissions: >-
    PLATFORM.CLIENT.APPROVE, PLATFORM.CLIENT.RESTRICT, PLATFORM.CLIENT_LIMIT.MANAGE,
    PLATFORM.CLIENT_KEY.MANAGE, PLATFORM.USAGE.VIEW, PLATFORM.USAGE.EXPORT,
    PLATFORM.ABUSE.VIEW, PLATFORM.ABUSE.MANAGE; the OPERATOR role holds them; console commands
    name the acting operator (--operator) and check the same permissions.

operator_self_service:
  # Specification 2.11 (owner instruction 2026-10-07): an operator who did not write the software
  # installs catto-mail on a clean Ubuntu Server 26.04 LTS VPS with one command, then configures,
  # tests, understands and operates it from the web application. Guides:
  # docs/production/VPS-INSTALL.md (primary), components.md, architecture.md.
  principle: >-
    The system explains itself, tests itself and says what still needs attention. The production
    safety model is unchanged: rootless Podman, network isolation, the socket-activated ingress,
    held-by-default deployment, explicit audited live activation, DKIM isolation, least-privilege
    database roles, authoritative suppressions.
  components: >-
    Canonical names, used everywhere: Catto-mail Web Application (symfony-app), Catto-mail Webhook
    Worker (webhook-worker), Catto-mail Email Validator (validator), Catto-mail Delivery Daemon
    (delivery), Postfix Mail Transfer Agent (postfix), OpenDKIM Signing Service (opendkim),
    PostgreSQL Database (postgres), nginx Frontend (nginx); on the host the host agent and the
    systemd user units. BIND (a DNS server) is not required: catto-mail only queries DNS.
  installer:
    command: install-catto-mail (repository root), run as root on Ubuntu Server 26.04 LTS
    release: >-
      an exact Git tag vX.Y.Z (never a branch), cloned for the service user. From v0.1.9 each
      release also has a GitHub Release page with notes and the source as zip and tar.gz with
      SHA256SUMS (owner decision 2026-10-07); the installer and upgrades use the tag.
    steps: >-
      OS, resources and public IPv4; packages from Ubuntu only (podman and its rootless helpers,
      git, python3, openssl, nftables, rsync, openssh-client, lego); the service user cattomail
      with subordinate IDs; lingering; net.ipv4.ip_unprivileged_port_start=25 persisted; the
      user's Podman socket; the release; infra/.env with generated secrets (0600); prod check;
      image build; certificates (Let's Encrypt when configured, otherwise a temporary self-signed
      bootstrap certificate); prod install (units, networks, volumes, containers); prod start in
      HELD mode; health; host checks; first backup; firewall rules generated (applied only with
      --apply-firewall); automatic start verified; a bootstrap sign-in link.
    properties: >-
      Every step prints PASS/WARN/FAIL; a FAIL names what, why, how to fix and whether re-running
      is safe. Idempotent: finished steps are detected and skipped; existing configuration and data
      are kept. It never enables live delivery and never changes the firewall unless asked.
  bootstrap_sign_in: >-
    `smarthostctl prod admin-link` prints a single-use sign-in link for an administrator
    (APP_ADMIN_EMAIL or a user with ADMIN): at most 15 minutes, used once, only its hash stored,
    redeemed through the ordinary sign-in, audited (auth.host_login_link_issued). It needs a shell
    on the host as the service user, which already controls every secret; no other bypass exists.
  host_agent: >-
    <instance>-host-agent.service (`smarthostctl prod agent run`, stdlib Python on the host) is the
    only bridge between the web application and the host. It reports host facts and host-side
    checks (OS, Podman, rootless, lingering, units, disk, memory, clock, firewall, containers,
    secret file modes, backups, certificate renewal, the boot recovery, and hourly the production
    preflight) and carries out the requests administrators record in the dashboard
    (system_requests: diagnostics.run, delivery.pause/resume, delivery.live_enable/disable,
    backup.run, backup.restore_rehearsal, dkim.generate/activate, tls.renew) with the existing
    audited tooling. The web application never runs host commands. Protocol: the console command
    smarthost:system:agent (claim, finish, report, diagnostics), JSON on stdin and stdout.
  diagnostics:
    storage: system_checks (latest result per check), system_check_runs (history), system_state (agent reports)
    results: PASS, WARN, FAIL, SKIPPED, INFO, each with a human explanation, a fix and a help topic
    history: every requested run, every change of result, and the first scheduled result of a check per UTC day; secrets are redacted before storage
    application_checks: database role, schema version, web health, tracking endpoints, a deterministic validation job (syntax-invalid addresses only, no network), delivery and webhook heartbeats, the host agent, bounce processing, the emergency stop
    host_checks: host, boot, containers, security, backups, TLS renewal, and the preflight sections config, host, runtime, exposure, ingress, tls, dns, dkim, postfix, delivery
  setup_wizard: >-
    System › System setup (SYSTEM.SETUP.MANAGE): welcome, host, web identity, SMTP identity, DNS,
    TLS, DKIM, database, web application, validator, delivery daemon, Postfix, OpenDKIM, webhook
    worker, backups, seed delivery test, bounce test, reboot test, production readiness. Progress
    is stored (setup_steps), the wizard is resumable, an administrator is taken to it after sign-in
    until the readiness step is done, and it stays available afterwards. Live delivery remains a
    separate, deliberate action.
  delivery_modes: >-
    HELD (live delivery not activated), LIVE, PAUSED (the emergency stop or pause flag; the Postfix
    queue held), STOPPED (the delivery daemon has no fresh heartbeat). Shown on every operator page.
  emergency_stop: >-
    "STOP SENDING EMAIL NOW" (SYSTEM.DELIVERY.CONTROL, a reason) sets delivery_controls.emergency_stop,
    which the delivery daemon reads with the pause flag file every few seconds, and asks the host
    agent to hold the Postfix queue. `smarthostctl prod pause/resume` set the same database stop.
    Resuming needs the typed confirmation RESUME SENDING; live enablement needs ENABLE LIVE DELIVERY.
  backups: >-
    <instance>-backup.timer at BACKUP_SCHEDULE: a backup into BACKUP_DIR (database, infra/.env, DKIM
    keys and tables, TLS secrets, manifest), AES-256 encrypted when BACKUP_ENCRYPTION_PASSPHRASE_FILE
    is set, the newest BACKUP_KEEP kept, copied with rsync to BACKUP_OFFHOST_TARGET (any SSH target
    or mounted path; no provider is chosen). A backup that is not off-host is a WARN. The restore
    rehearsal restores the newest backup into a temporary database, verifies checksums, tables and
    the migration level, and drops it.
  certificates: >-
    Let's Encrypt with DNS-01 through lego and ACME_DNS_PROVIDER (credentials in
    ACME_CREDENTIALS_FILE, never in infra/.env); port 80 is never opened. `prod tls acme
    issue|renew|ensure|status`; <instance>-tls-renew.timer renews daily ACME_RENEW_DAYS before
    expiry and installs with `prod tls set`. A manual provider prints the TXT record (no unattended
    renewal). Expiry and renewal failures are diagnostics.
  logs: "`smarthostctl prod logs app|webhook|validator|delivery|postfix|opendkim|nginx|postgres|agent [lines|-f]`"
  help: >-
    Help (PLATFORM.HELP.VIEW): topics on the system, components, flows, validation and its
    results, lists, re-permission, suppressions, sending and rollout, delivery states, tracking,
    bounces, complaints, emergency controls, DNS, PTR, SPF, DKIM, DMARC, TLS, each component in depth,
    clients, sending domains, backups, logs, upgrades, security and troubleshooting; linked in context
    from the dashboard and from every check.
  terminology: >-
    "Remote accepted", never "delivered to inbox"; "open observed", never "read"; validation is not
    consent; an ordinary unsubscribe is the client's state, not a Smarthost suppression.
  address_batches:
    purpose: >-
      Administrator tool (SYSTEM.ADDRESS_BATCH.MANAGE) to validate an address list of up to 10,000
      rows on behalf of one client, review it and, with approval, send in stages; also the
      re-permission workflow. Not a replacement for the client's mailing-list application.
    import: >-
      TXT (one address per line) or CSV (header row, chosen column), UTF-8, at most 10 MiB. Preview
      before import. Cleanup only of surrounding whitespace, mailto:, Name <address>, and the D-18
      domain lower-casing. Every non-blank row is kept: imported, duplicate (of the first row with
      the same normalised address) or malformed (not an address; reported, not validated). File
      name, SHA-256, column, administrator, time, name, description, source and row numbers are
      recorded. CSV reports per category; formula-like cells are neutralised.
    validation: >-
      Ordinary validation jobs of the batch's client (external reference address-batch:<id>; each
      address's external reference is the entry id), so quotas apply and the Email Validator does
      the work. The page follows the progress.
    state_dimensions: >-
      Separate, never one status (status-vocabulary operator_address_states): validation result
      (pending, valid, invalid, risky, unknown, temporary_failure) with flags (typo_suspected,
      disposable, role_account, accept_all); send eligibility (eligible, pending_review, blocked_*,
      excluded); consent (unknown, unconfirmed, confirmed, unsubscribed, global_opt_out); delivery
      state (the message status); engagement (not_opened, open_observed, clicked). Typo suggestions
      are never applied automatically: an accepted suggestion is added as a correction entry and
      validated.
    sending: >-
      Stages seed (typed-in addresses the administrator owns, at most 20), controlled, rollout, full;
      only eligible, not-yet-sent entries are selected; anything but a seed test needs the batch's
      recorded compliance approval and List-Id; the ordinary send-job service applies the client's
      domain rules, quotas and limits, and the delivery daemon's suppression check stays
      authoritative; in HELD mode the job waits. Every message is subscription class with the
      recipient's own answer links as its unsubscribe URL.
  repermission: >-
    Public page /p/{token}: 256-bit random tokens, stored as SHA-256 with an expiry
    (APP_REPERMISSION_RESPONSE_DAYS), no address in any URL, no session or cookie. GET only shows the
    three choices; a POST answers: confirm (consent confirmed), unsubscribe from this list (the
    client's unsubscribe; no suppression; also RFC 8058 one-click), global opt-out (a global
    recipient_global_opt_out suppression reported for the batch's client; final on the page).
    Answers are idempotent, audited without the address, and forwarded as repermission.responded.
  client_integration: >-
    ctnlist (docs/integration/ctnlist.md): ctnlist owns subscribers, lists and consent; catto-mail
    owns validation, sending, suppression, events and infrastructure; integration only through the
    API and webhooks. The ctnlist-side handling of repermission.responded is outstanding.

compliance:
  scope:
    - applicable_data_protection_law
  design_requirements:
    - provenance of imported addresses
    - auditable suppression/unsubscribe events
    - configurable retention
    - client data isolation
    - export/delete workflows when required
    - purpose limitation in stored metadata
  retention:
    # D-14
    rendered_content: transient; purged on Postfix acceptance; staged-content cleanup default 7 days (configurable)
    configurable_periods:
      - validation history
      - suppressions
      - message metadata and events
      - tracking tokens and link mappings
      - unmatched DSNs
      - audit logs
      - usage records
      - webhook delivery history (APP_RETENTION_WEBHOOK_DELIVERIES_DAYS, specification 2.8)
    rule: >-
      Phase 0 hard-codes no final long-term retention period for these categories; each is
      configurable and the operator's compliance specification sets the production policy.
      Empty means no automatic deletion: webhook deliveries (and their outbox events) stay durable
      until a production retention policy sets a period. No deletion command exists for them yet.
  explicit_note: >-
    Technical validation does not establish lawful consent. Consent-dependent sending requires the
    operator's own legal/compliance review.
  live_sending_compliance_gate:
    rule: >-
      Consent-dependent campaign mail is not sent to the public Internet until the operator's
      legal/compliance specification for that sending has been reviewed and approved.
    not_blocked: technical development, validation and Mailpit/local testing

production_operations:
  # Phase 8, specification 2.9. Procedures: docs/production/runbook.md
  tooling: >-
    `smarthostctl prod <command>` (infra/bin/smarthostctl-prod) acts only on a configuration with
    SMARTHOST_ENV=production; the development commands refuse one. Configuration: the production
    profile of the environment contract (infra/production.env.example; `prod init-env` generates
    the secrets on the host); `prod check` and every rendering apply the production safety rules.
  configuration_safety_rules:
    - APP_ENV=prod; no unverified-domain bypass; no webhook private-host allowlist; no relayhost (no Mailpit or capture relay) in held or live mode
    - every secret present (MAILER_DSN optional), at least 16 characters; a valid APP_ENCRYPTION_KEYS keyring
    - SMARTHOST_PUBLIC_BASE_URL = https://PROXY_SERVER_NAME; fully qualified, non-reserved names (a rehearsal without egress may use reserved names); a dedicated bounce domain
    - SMARTHOST_PUBLIC_IPV4 a public address when egress is enabled; live delivery requires egress
    - TRUSTED_PROXIES empty (no proxy in front of nginx; client addresses come from the ingress socket); /24 private non-overlapping subnets; service addresses are the topology aliases
    - the same rules at process start where they apply (Symfony SafetyGuard, Postfix, Go, validator)
  live_delivery_states:
    capture: development and test; Postfix relays everything to Mailpit
    held: >-
      production with SMARTHOST_LIVE_DELIVERY_ENABLED=false (the installed state): Postfix has no
      relayhost and its default transport is retry(8): an outbound recipient is refused
      temporarily at submission (450 "live delivery is not activated") and anything already
      queued stays deferred, except mail from APP_MAIL_FROM (dashboard sign-in), which keeps the
      smtp transport; the Go daemon claims no send jobs
    live: production with SMARTHOST_LIVE_DELIVERY_ENABLED=true; direct MX delivery
    paused: >-
      the operator's emergency pause in any state: a durable flag in the observability volume
      (Postfix: defer_transports=smtp, accepted mail stays queued; Go: no claims, no new
      submissions); inbound port 25 keeps working
  activation_gate: >-
    `prod live-enable --operator --note` runs the activation preflight (every check live
    delivery depends on must PASS; a WARN on such a check is a FAIL), audits
    delivery.live_enabled, sets the variable and recreates Postfix and the delivery daemon;
    install/recreate refuse to (re)create a live configuration that fails it
  delivery_controls_permission: >-
    SYSTEM.DELIVERY.CONTROL (ADMIN only): live-enable, live-disable, pause and resume are audited
    with the operator and a note (smarthost:ops:record) before they act
  preflight:
    levels: [PASS, WARN, FAIL, INFO, SKIP]
    sections:
      config: "the production safety rules; the warm-up ceiling; retention decisions pending"
      host: "OS (Ubuntu 26.04 LTS), Podman >= 4.9, binaries, lingering, podman.socket, net.ipv4.ip_unprivileged_port_start against the configured binds (running and persisted); checked before containers are created or started"
      runtime: "images, health, database, migrations current, grants equal to schema.md section 6"
      exposure: "no published container port, network membership per the matrix (ingress network: nginx and Postfix only), private keys only in their owner, network flags, host listeners"
      ingress: "the ingress socket and service active with exactly the configured binds, nginx holding the inherited sockets, Postfix port 25 as the PROXY-protocol listener on the ingress network only, TRUSTED_PROXIES empty, and the two-source proof at nginx and Postfix (smarthostctl prod ingress-check)"
      tls: "the certificates served on 443 and 25 (STARTTLS): validity, expiry within 14 days, names, trust"
      dns: "A records, PTR, forward-confirmed reverse DNS, bounce-domain MX to this host, SPF of the bounce domain and the EHLO name, DMARC of every sending domain, inbound SMTP reachability"
      dkim: "per verified sending domain of an active client and the APP_MAIL_FROM domain - active selector, key present, OpenDKIM table equal to the database, DNS key equal to the private key"
      postfix: "hostname, no relayhost, mynetworks, relay refusal (live RCPT test, no DATA), bounce domain, VERP delimiter, TLS, sender ownership, milter, held/live mode, pause, optional outbound port-25 probe (EHLO/QUIT)"
      delivery: "heartbeat, state against the configuration, queue snapshot freshness"
    outputs: [text, json, dns checklist, nftables ruleset]
  dkim_key_management: >-
    smarthost-dkim-key inside OpenDKIM (`prod dkim`): generate (never overwrites; not yet
    signing), activate (SigningTable; OpenDKIM restarted), retire (never the active selector), dns
    (record from the private key), pubkey, list; multiple domains and selectors; planned rotation
    generate -> publish -> activate -> wait -> retire. Private keys never leave the OpenDKIM volume
    except in the backup.
  postfix_production:
    - submission sender ownership (smtpd_sender_login_maps, reject_sender_login_mismatch): the delivery account only its VERP return paths, the web application only APP_MAIL_FROM
    - port 25 never relays and accepts only bounce-domain recipients; VRFY disabled; HELO required
    - IPv4 only; opportunistic outbound TLS; inbound STARTTLS with the operator certificate
  warm_up: >-
    The production profile starts at stage 0 (DELIVERY_GLOBAL_RATE_PER_MINUTE=5, small
    concurrency); the operator raises the limits stage by stage on evidence (deferrals, bounces,
    complaints); nothing raises them automatically
  emergency_controls:
    - "pause/resume: all outbound mail (prod pause, prod resume)"
    - "suspend: a client's work stops (client status suspended)"
    - "throttle: a client's submissions are paced (client status throttled)"
    - "cancel: a send job before dispatch finishes"
  delivery_heartbeats: >-
    one row per Go daemon: version, live/held/paused, the warm-up ceiling, the Postfix queue
    depth (active, deferred, hold, incoming) and time of the newest queue snapshot, counters;
    shown on the operator overview and by smarthost:ops:status
  backups: >-
    `prod backup`: pg_dump (custom format), the OpenDKIM keys and tables volumes, the .env
    (secrets, keyring), the TLS secrets where Podman can export them, a manifest with migrations
    and checksums; optionally the Postfix queue and DSN spool. `prod restore` replaces the
    database and the DKIM volumes in an existing topology. Authoritative: the database, DKIM keys
    and configuration; transient: queue, spool, logs, snapshots, images
  upgrades: >-
    `prod upgrade <tag>`: runtime preflight, backup, build the tag, recreate (migrations and
    grants run at start), runtime preflight. `prod rollback <tag> <backup>`: previous images and
    the database taken before the upgrade. Released migrations are immutable
  seed_testing: >-
    operator-triggered only (`prod seed-test send ... --i-own-these-addresses`, at most 10
    addresses): through the public API; expects remote_accepted (outbound path) or hard_bounced
    (bounce path via the DSN spool)
  rehearsal: >-
    `smarthostctl test phase8-rehearsal` deploys the production topology locally (separate
    instance, no Internet egress, loopback ports) and exercises install, held mode, preflight,
    controls, backup/restore, upgrade and D-35, without touching the development pod

testing:
  principles:
    - no real Internet email in normal automated tests
    - deterministic failure simulation
    - test cross-language database contracts
    - test migrations from an empty database
  unit:
    symfony:
      - API authentication
      - tenant scoping
      - idempotency (job creation, recipient batches, submit)
      - job validation, batch limits and duplicate detection across batches
      - tracking token validation
      - webhook signatures and secret rotation
      - sending-domain TXT verification
    python:
      - syntax classification
      - typo suggestions
      - DNS state mapping
      - Null MX handling
      - temporary DNS errors
      - SMTP response classification
      - retry/backoff logic
      - accept-all classification
      - lease renewal and reclaim
    go:
      - VERP generation
      - Postfix queue-id parsing/correlation
      - SMTP/DSN status classification and failure scope
      - bounce parsing
      - event append logic and source-key de-duplication
      - pacing/backoff
      - tracking instrumentation and link-rewriting exclusions
      - queue-snapshot reconciliation
  integration:
    - Symfony creates validation job and Python completes it through PostgreSQL
    - Symfony collects recipient batches, submits the job and Go submits messages to Postfix
    - Postfix routes to Mailpit in development
    - outbound mail is DKIM-signed by OpenDKIM; milter failure causes tempfail and retry, never unsigned sending
    - fake SMTP simulates 250, 421, 450, 451, 550, timeout and connection-refused cases
    - inbound synthetic DSN maps to the correct VERP/message
    - a global suppression caused or reported through one client stops submission for another client
    - lost log events are recovered or produce outcome_unknown through reconciliation
    - open pixel records one or more events safely
    - click redirect records event then redirects to stored target
    - webhook outbox rows are delivered only by the Symfony webhook worker
    - a test API client can authenticate and use the API without DB access
  load:
    initial_targets:
      - one 10000-address validation job completes without unbounded memory growth
      - per-domain concurrency limits remain enforced under skewed domain distributions
      - dashboard pagination does not aggregate entire job/message tables in memory
  live_smoke_test:
    conditions:
      - only after local test suite passes
      - only against addresses/domains owned or explicitly authorised for testing
      - tiny volumes
      - live sending explicitly enabled by configuration

observability:
  requirements:
    - structured logs for Symfony, Python and Go
    - correlation identifiers: client_id, job_id, message_id where applicable
    - operator dashboard for queue depth and worker health
    - Postfix queue visibility
    - validation backlog visibility
    - failed webhook visibility
    - unmatched DSN visibility
    - outcome_unknown messages, log gaps and stale queue snapshots visibility
    - >-
      Postfix queue depth and snapshot age as a durable signal (delivery_heartbeats, written by
      the Go daemon from the newest queue snapshot); web requests never run Postfix commands
      (specification 2.9)
    - delivery state (capture, held, live, paused) and the warm-up ceiling in force (specification 2.9)
  metrics_initial:
    - validation_jobs_pending
    - validation_addresses_processed
    - send_jobs_pending
    - messages_by_current_status
    - messages_outcome_unknown
    - postfix_queue_depth
    - postfix_queue_snapshot_age
    - hard_bounce_rate
    - soft_bounce_rate
    - deferral_rate
    - complaint_rate
    - open_events
    - click_events

user_interfaces:
  client_dashboard:
    - validation upload/job history
    - validation result table with evidence and suggested typo corrections
    - downloadable cleaned/result files
    - send-job history
    - per-message event timeline
    - delivery acceptance/bounce/deferral statistics
    - recorded open/click statistics with caveat text
    - API key management
    - usage view
    - sending-domain verification and DKIM status
    - webhook endpoint management
  operator_dashboard:
    - client approval queue
    - account suspension/throttling
    - cross-client bounce/complaint monitoring
    - Postfix queue health and queue-snapshot freshness
    - validation backlog
    - Go/Python/webhook-worker health
    - unmatched DSNs and match requests
    - outcome_unknown messages
    - failed webhooks
    - audit history
  UI_technology:
    - Twig
    - Symfony UX
    - LiveComponent where it reduces hand-written table/AJAX complexity
    - Stimulus for focused client-side interactions
  UI_requirements:
    - server-side pagination for large tables
    - sortable/filterable tables
    - clear distinction between validation certainty and delivery certainty
    - no claim that recorded open equals proven human read
    - outcome_unknown is never presented as delivered
  dashboard_layout: >-
    Owner decision (2026-10-10). One shell for both workspaces, using the full page width: round
    area buttons on the left (operator console: Overview, Mail flow, Clients, System, Access;
    client workspace: Overview, Sending, Validation, Settings, Usage; Help and the workspace switch
    below), the current area's pages as pills at the top (on the operator Overview the pills choose
    the period: 24 hours, 7 days, 30 days, 90 days), and at the top right the delivery mode, the
    STOP SENDING EMAIL NOW control (a reason is required), what needs attention and the account
    menu. Areas, pills and badges appear only where the user's permission keys allow. The operator
    Overview shows KPI cards against the previous period, send jobs by hard-bounce rate, mail flow
    per hour or day, workers and queues, what needs attention, per-client rates, validation results,
    component health, suppressions and recent activity, all from the per-job counters and other
    durable signals. The submission-rate chart (Overview and Mail flow › Delivery) shows the typical
    and peak messages submitted to Postfix per minute in each hour or day against the
    DELIVERY_GLOBAL_RATE_PER_MINUTE ceiling (partial index message_events_submitted_idx). The client
    Overview has the same period choice, with messages per hour or day, KPI cards, quota rings,
    validation results, sending domains and engagement, from that client's jobs only. The global
    search (the round search button at the top right) finds clients, send and validation jobs,
    messages, suppressions, sending domains and users by an id, an email address, a domain, an
    external reference or a name, with exact or prefix lookups on indexed columns: operators within
    their permission keys (/dashboard/search), and in a client workspace only that client
    (/dashboard/c/{client}/search, through ClientAccess). Charts are drawn with Chart.js 4, vendored through the AssetMapper import map
    and loaded only on pages with a chart; the Outfit font is served by the application (SIL Open
    Font License); every style lives in the stylesheet (the Content-Security-Policy allows no inline
    styles). APP_TIMEZONE (default Africa/Johannesburg, SAST) is the installation's time zone: the
    dashboard shows times in it, and the Overview's hours and days and the quota, usage and billing
    calendar days and months are its own (owner decision, 2026-10-10); storage, the API, webhooks
    and exports carry UTC timestamps.
  phase_6_implementation:
    # Specification 2.6: what the Phase 6 dashboards provide and how.
    authentication: >-
      passwordless since specification 2.7 - /dashboard/login asks for an email address (CSRF) and
      emails a single-use link to /dashboard/login/verify; sign-out is a POST with a CSRF token; no
      self-service registration (operators create users on the Users page); APP_ADMIN_EMAIL always
      may sign in and receives ADMIN; API keys never authenticate a browser
    access_control: >-
      operator pages each require a permission key (PLATFORM.OVERVIEW.VIEW, PLATFORM.CLIENT.VIEW/
      MANAGE, PLATFORM.USER.VIEW/MANAGE, PLATFORM.DSN.VIEW/MANAGE, PLATFORM.SUPPRESSION.VIEW/
      MANAGE, PLATFORM.AUDIT.VIEW, PLATFORM.WEBHOOK.VIEW, SYSTEM.ROLE.VIEW/MANAGE); built-in roles
      ADMIN (every permission, fixed) and OPERATOR (every PLATFORM.* permission, editable); custom
      roles are created and edited on the Roles page; changes apply at each holder's next request
    client_access: >-
      every client page is under /dashboard/c/{client id}; a client the user may not see (no
      membership, insufficient role, disabled user) is answered exactly like a missing one (404),
      and every query carries the client id; reads need a viewer role, domain verification a
      member role, lifting the client's own global opt-out an admin role plus the D-37 rule
    client_pages:
      - overview (validation and sending counters from the per-job counters, recorded engagement of the last 30 days, sending domains, usage this month)
      - validation jobs (status, external reference and date filters) and job detail with paginated, filterable, sortable address results
      - validation result export as CSV, streamed in keyset batches; columns are exactly the OpenAPI ValidationAddress fields; formula-like cells are prefixed with an apostrophe
      - send jobs (filters as for validation jobs) and job detail with transport outcomes, recorded engagement, clicks per link and the paginated message list
      - message event timeline (interpreted fields only; never tokens or source keys)
      - suppressions visible in full (client-scoped and own reported opt-outs) and this client's suppressed messages with only the broad reason of a global suppression, never its reporter, reference or ids
      - sending domains (verification record, status, DKIM status, whether sending is permitted, DNS check action)
      - usage per month and individual usage records
    operator_pages:
      - system overview from durable database signals (work queues, worker leases, newest results, Postfix-log ingest cursor, messages per status, rates per client over 7 days, suppressions, unmatched DSNs, webhook outbox)
      - clients (status filter, search) and client detail (status change, global opt-out capability with a note, domains, API key metadata, members, webhook endpoints)
      - unmatched DSNs (status and classification filters), detail with parsed evidence and candidates, match request and dismissal
      - suppressions (address, reason, state and scope filters, operator provenance), operator block creation, lifting with a required note
      - audit log (action, actor, target and date filters; secret-like keys redacted on display)
      - webhook deliveries (pending, retrying, delivered, failed; client, endpoint and event filters), outbox events and worker heartbeats (Phase 7; outbox state only before it)
      - users (create, enable/disable, send a sign-in link, grant and revoke roles, add/change/remove client memberships) and roles & permissions (ADMIN only)
    lists: >-
      keyset (cursor) pagination over (sort expression, id); sort names and filter keys are
      whitelisted; values are bound parameters; a cursor whose values do not fit the sort type
      starts again at the first page
    http_security: >-
      every change is a POST with a CSRF token and goes through the existing audited application
      service; dashboard responses carry a Content-Security-Policy with a per-request nonce for
      the import map (same-origin scripts and styles only, no CDN), frame-ancestors none,
      X-Frame-Options DENY, nosniff, Referrer-Policy same-origin and Cache-Control no-store;
      production error pages are generic
    not_in_phase_6:
      - validation upload in the browser (jobs are created through the API)
      - API key management in the browser (audited console commands remain; users, memberships and roles are managed in the browser since 2.7; webhook endpoints since 2.8)
      - Postfix queue depth and snapshot age (the snapshots are read only by the Go daemon; the overview shows the messages Smarthost considers to be in Postfix)
      - LiveComponent (server-rendered GET forms and links did not need it)

smtp_reputation_and_deliverability:
  production_prerequisites:
    - dedicated Smarthost VPS/IP
    - forward DNS
    - PTR/reverse DNS aligned with sending identity
    - SPF
    - DKIM (OpenDKIM with per-domain selectors)
    - DMARC policy appropriate to rollout stage
    - TLS
    - bounce domain routing
  rollout:
    - start with owned seed addresses
    - small controlled volumes
    - gradual IP/domain warm-up
    - observe deferrals/bounces/complaints before increasing volume
  prohibitions:
    - never use a large unproven address list as an IP warm-up method
    - never claim to detect spam traps reliably

non_goals_initial:
  - Kubernetes
  - custom SMTP server replacing Postfix
  - direct client-application-to-Smarthost database sharing
  - real-time microservice RPC between Symfony, Python and Go
  - machine-learning mailbox-validity classifier in the first release
  - public self-service high-volume sending without operator review
  - multiple sending-IP pools in the first release
  - complex billing provider integration before the core pipeline is proven
  - mail merge or template rendering inside Smarthost

implementation_phases:
  - phase: 0
    name: canonical_architecture_and_contracts
    objective: freeze architecture, schemas, API contracts and development conventions before application logic
    deliverables:
      - canonical YAML specification
      - human architecture/development specification
      - repository skeleton
      - environment-variable contract
      - initial API contract/OpenAPI draft
      - database ERD/schema proposal
      - event/status vocabulary
    acceptance:
      - no unresolved ownership conflict between client applications and Smarthost
      - send execution ownership explicitly assigned to Go
      - message/event model agreed
      - inbound bounce path represented
  - phase: 1
    name: podman_development_environment
    objective: create deterministic rootless local environment with no real mail leaving the development machine
    deliverables:
      - Podman networks
      - systemd user units and timers (persistent pod lifecycle since D-35)
      - PostgreSQL with infrastructure role bootstrap
      - nginx reverse proxy
      - Symfony PHP-FPM container and webhook-worker unit
      - Python container
      - Go container
      - Postfix with shared observability volume and DSN spool
      - OpenDKIM milter with development test key
      - Mailpit
      - fake SMTP server
      - health checks
      - verification of Postfix logging, rotation, queue-snapshot and shared-volume ownership behaviour
    acceptance:
      - all services start/restart through systemd user units
      - no PostgreSQL/Python/Go/PHP-FPM/OpenDKIM public exposure
      - Postfix test mail reaches Mailpit only
  - phase: 2
    name: database_and_symfony_foundation
    objective: establish schema ownership, tenant model, API auth and job primitives
    deliverables:
      - Doctrine entities/migrations
      - clients/api_keys/users/client_memberships
      - sending domains and TXT verification
      - validation job tables
      - send/recipient-batch/message/event tables
      - webhook outbox and endpoint tables
      - audit log
      - API key authentication
      - idempotent job creation, batched recipient ingestion and submit primitives
    acceptance:
      - clean database migration succeeds
      - tenant isolation tests pass
      - raw API keys never persist
  - phase: 3
    name: python_validation_engine
    objective: implement evidence-based batch validation without sending email
    deliverables:
      - leased job claiming
      - syntax checks
      - typo suggestions
      - DNS/MX/Null-MX handling
      - disposable/role flags
      - SMTP probing
      - per-domain throttling
      - retry/backoff
      - classification and job summaries
    acceptance:
      - deterministic fake-DNS/fake-SMTP tests pass
      - no DATA command is emitted
      - 10000-address synthetic job completes within configured resource bounds
  - phase: 4
    name: go_postfix_delivery_pipeline
    objective: create reliable tracked submission and transport-event recording
    deliverables:
      - leased send-job claiming
      - message creation from sealed recipients
      - VERP
      - MIME assembly and header contract
      - Postfix submission
      - queue-id correlation and rendered-content purge
      - Postfix event/log processing with persistent cursors
      - queue-snapshot reconciliation
      - append-only message events
      - per-domain pacing
      - DKIM signing through OpenDKIM
    acceptance:
      - Mailpit receives expected test messages
      - queue IDs map back to messages
      - synthetic 4xx/5xx scenarios create correct event history
      - messages are DKIM-signed; milter failure causes tempfail and retry
      - lost log events are reconciled or become outcome_unknown
  - phase: 5
    name: inbound_dsn_and_suppression
    objective: process real-format bounces and create safe transport suppression signals
    deliverables:
      - bounce-domain configuration
      - inbound Postfix path
      - DSN parser
      - VERP resolution
      - hard/soft bounce policy including repeated-soft-bounce rule
      - ARF complaint parsing
      - global suppression records with provenance (D-30)
      - trusted-client recipient global opt-out API and operator capability
      - suppression lifting (client and operator) with audit
      - unmatched DSN handling and operator resolution (console commands; the operator dashboard since Phase 6)
      - processed spool retention
    acceptance:
      - synthetic DSNs resolve exact messages
      - hard bounces create suppression
      - temporary failures do not immediately create permanent suppression
      - recipient-specific hard bounces and complaints create global suppressions; non-recipient failures do not
      - a global suppression stops submission for every client
      - DSN processing is idempotent across crash, retry and restart
  - phase: 6
    name: tracking_and_dashboards
    objective: expose useful operational and client visibility
    deliverables:
      - validation result UI
      - send/message event UI
      - operator health UI
      - open tracking pixel
      - click redirect tracking
      - recorded-open/click metrics
    acceptance:
      - tables are server-side paginated
      - tracking URLs do not expose raw email addresses
      - click redirects cannot be abused as open redirects
  - phase: 7
    name: first_client_api_integration
    objective: make the first client application a real external Smarthost client
    client_integration_expectations:
      # Contract-level expectations only; the client application's own repository decides how.
      - public API with the client's API key, kept as a secret
      - validation job submission and result retrieval (webhook and/or polling)
      - batched send-job submission with rendered content
      - webhook receipt with signature verification and event-id de-duplication
      - external-reference mapping
      - polling reconciliation when a webhook is missed
    acceptance:
      - the client performs the full workflow without direct Smarthost DB access
      - Smarthost can be restarted/deployed independently of the client
    smarthost_side: >-
      Specification 2.8: the real webhook worker (webhooks.delivery_contract), POST
      /v1/webhooks/test, dashboard webhook management and delivery visibility, proven by a
      deterministic external test client (API-only driver and an independent webhook receiver,
      smarthostctl test phase7-e2e). Integration of the real first client application in its own
      repository remains outstanding.
  - phase: 8
    name: controlled_production_launch
    objective: move from captured mail to live Internet delivery with reputation safeguards
    deliverables:
      - production VPS deployment
      - DNS/PTR/SPF/DKIM/DMARC with production OpenDKIM keys
      - live bounce routing
      - owned seed-list testing
      - warm-up controls
      - operational runbook
    acceptance:
      - production smoke tests pass
      - bounce routing verified
      - metrics and emergency throttle/suspension controls verified
    repository_side: >-
      Specification 2.9: production topology and deployment tooling (smarthostctl prod), the
      production configuration profile and safety rules, the held/live/paused delivery states
      with an audited, preflight-gated activation, the production preflight (host, runtime,
      exposure, ingress, TLS, forward/reverse DNS, SPF, DKIM, DMARC, bounce domain, Postfix,
      delivery), the socket-activated ingress that preserves client addresses, production
      DKIM key management, warm-up and throttling controls, emergency pause, delivery heartbeats
      (queue depth), backup/restore, upgrade/rollback, the owned seed-test tool and the runbook
      (docs/production/runbook.md), proven by a local production rehearsal without Internet
      egress. Pending outside the repository: the VPS, DNS/PTR, certificates, the live smoke
      tests and the traffic rollout.
  - phase: 9
    name: public_saas_hardening
    objective: prepare Smarthost for external paying clients after internal production use proves stable
    deliverables:
      - account approval workflow
      - stronger rate/volume enforcement
      - webhook hardening
      - usage/billing integration
      - acceptable use policy hooks
      - client-facing API documentation
      - abuse monitoring
    acceptance:
      - tenant isolation security review complete
      - operator kill switch tested
      - per-client usage metering reconciles against jobs/messages
    repository_side: >-
      Specification 2.10 (saas_operations): the client lifecycle with approval, throttling,
      suspension and closure (reasons, permissions, audit), the gated public-onboarding entry
      point (disabled; no public route), service-policy acceptance, contact metadata and private
      notes, per-client limits and concurrency-safe quotas, the API-key lifecycle (names,
      expiry, show-once, rotation), usage period summaries, reconciliation, provider-neutral
      billing statements and export, per-client reputation metrics with operator alerts, webhook
      endpoint health, the public integration guide at /docs/api, and the two-client
      tenant-isolation, permission, audit and query-plan reviews. Pending live traffic: the
      threshold calibration, pricing and plans, policy text, and the decision to open public
      onboarding.

  - phase: 10
    name: operator_self_service
    objective: >-
      an operator without knowledge of the code installs catto-mail on a clean Ubuntu Server 26.04
      LTS VPS and configures, tests, understands and operates it from the web application
    deliverables:
      - one-command installer from an exact release tag
      - bootstrap administrator sign-in
      - administrator setup wizard
      - permanent diagnostics with history, and a system health dashboard
      - help and tutorials
      - host agent for host-side checks and dashboard requests
      - Let's Encrypt (DNS-01) automation, scheduled and off-host backups, restore rehearsal
      - administrator address batches, validation review, staged sends, re-permission
    acceptance:
      - the installer runs on Ubuntu Server 26.04 LTS and starts in held mode
      - every subsystem has a diagnostic with an explanation
      - nothing is sent without the operator's deliberate action
    repository_side: >-
      Specification 2.11 (operator_self_service). Pending on a real VPS: the provider's port-25
      policy, PTR, public DNS, Let's Encrypt with the operator's DNS provider, outbound delivery,
      real bounces and complaints, and the reboot of a real machine.

first_implementation_priority:
  order:
    - canonical specifications
    - Podman environment
    - database foundation
    - Python validation worker
    - Go/Postfix delivery
    - bounce processing
    - tracking/dashboard
    - client integration
    - production rollout
    - public SaaS

completion_definition:
  core_internal_product_complete_when:
    - a client application can authenticate to the Smarthost API
    - a client application can submit a validation job of up to 10000 addresses
    - Python records evidence-based validation results
    - a client application can submit a tracked send job with fully rendered recipient content
    - Go submits per-recipient messages to Postfix
    - Postfix outcomes are represented as append-only events
    - inbound hard/soft bounces map to exact messages
    - transport suppressions are enforced
    - recorded opens and clicks are available with correct semantics
    - operator can inspect queue/worker health and stop abusive sending
    - the entire workflow is tested locally without public Internet mail

