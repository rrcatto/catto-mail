      Incorporates the Phase 0 architecture decisions and resolves the mail-merge, tracking,
      unsubscribe, send-ingestion, webhook, DKIM and transport-reconciliation contracts:
      fully rendered recipient content from client applications; staged recipient batches with
      collecting/queued/processing/dispatched/completed send jobs; opaque random tracking
      tokens; RFC 8058 List-Unsubscribe for subscription messages; webhook transactional outbox
