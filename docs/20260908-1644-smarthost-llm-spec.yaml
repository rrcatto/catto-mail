    decision_log: docs/architecture/open-decisions.md
  - version: "2.2"
    date: "2026-10-03"
    summary: >-
      Incorporates the decisions taken after Phase 2: work-creating API operations are
      forbidden (403) for pending_approval and suspended clients and workers claim only active
      or throttled clients' work (D-31); the exact D-18 address-normalisation rule with UTS #46
      non-transitional IDNA and a shared cross-language test-vector contract (D-32); validation
      usage is metered by the Python validator per address that reaches done, in the same
      transaction as the fenced result (D-33); idempotent-replay semantics without stored
      response bodies (D-34).
    decisions_incorporated:
      - D-31
      - D-32
      - D-33
      - D-34
    decision_log: docs/architecture/open-decisions.md
  - version: "2.3"
    date: "2026-10-04"
    summary: >-
      Replaces the Quadlet pod/container runtime with a persistent pod lifecycle (D-35): the
      smarthost pod and its containers are created once and then started, stopped and restarted
      as the same Podman objects (also from Podman Desktop); a systemd user service starts the
      existing pod at boot; only an explicit recreate replaces pod and containers, and volume
      destruction stays a separate explicit operation.
    decisions_incorporated:
      - D-35
    decision_log: docs/architecture/open-decisions.md
  - version: "2.4"
    date: "2026-10-04"
    summary: >-
      Resolves D-30: automatic transport suppressions (recipient-specific hard bounce, verified
      complaint, repeated recipient soft bounces) are global across the installation
      (client_id NULL) and apply to every client; temporary, provider, reputation, domain, DNS,
      connection, TLS, infrastructure and ambiguous outcomes never create one; repeated soft
      bounces are evaluated globally and give a temporary suppression lasting the configured
      window. Adds the recipient_global_opt_out reason, reported through POST
      /v1/global-suppressions only by clients an operator granted can_submit_global_suppressions,
      with explicit provenance (source_client_id, source_event_id), idempotent creation and
      client/operator lifting that never deletes history or overrides independent suppressions.
      Ordinary unsubscribes remain client business state. Details the inbound DSN/ARF parsing,
      correlation, classification, unmatched-DSN workflow and spool retention.
    decisions_incorporated:
      - D-30
    decision_log: docs/architecture/open-decisions.md
  - version: "2.5"
    date: "2026-10-05"
    summary: >-
      Phase 5 corrections. D-36: DSNs and complaints correlate automatically only through
      Smarthost-issued identifiers (VERP token, envelope id, Smarthost Message-ID, Postfix queue
      id); recipient address plus returned sender is forgeable and, with global suppressions, is
      stored only as operator candidate information on an unmatched DSN. D-37: a trusted client
      may create a recipient global opt-out while pending_approval or suspended (a do-not-contact
      operation, not work creation) but may lift one only while active or throttled. D-38:
      durable opt-out request idempotency in global_suppression_requests, independent of the
      suppression row, so a used key keeps its meaning after a lift. ARF abuse-only complaints
      and the D-30 global policy are unchanged.
    decisions_incorporated:
      - D-36
      - D-37
      - D-38
    decision_log: docs/architecture/open-decisions.md
  - version: "2.6"
    date: "2026-10-05"
    summary: >-
      Phase 6 tracking and dashboards. Specifies the tracking endpoints' eligibility, identical
      responses for unknown tokens, the bounded recording rule (one recorded open per message per
      60 seconds, one recorded click per message and link per 10 seconds, at most 1000 events of
      a type per message, a per-address request limit that only skips the write), token-free
      logging, and the dashboards' scope, access model, keyset pagination and HTTP security.
      Adds the message_events engagement index and read-only web access to the Postfix-log
      ingest cursor for the operator overview. No architecture, ownership or protocol change.
    decisions_incorporated: []
    decision_log: docs/architecture/open-decisions.md
  - version: "2.7"
    date: "2026-10-06"
    summary: >-
      Passwordless dashboard sign-in with roles, permissions and an editable access-control list,
      by owner instruction. Users sign in with single-use links emailed through authenticated
      Postfix submission (Mailpit in development); passwords and users.global_role are removed;
      APP_ADMIN_EMAIL always receives ADMIN (every permission); OPERATOR replaces the operator flag;
      operator pages require permission keys; users, roles and memberships are managed in the
      browser. New tables roles, role_permissions, user_roles, auth_login_tokens; new APP_ADMIN_EMAIL,
      APP_MAIL_*, APP_LOGIN_LINK_TTL_SECONDS settings; the development public URL is
      https://localhost:8443 so emailed links open in a browser.
    decisions_incorporated: []
    decision_log: docs/architecture/open-decisions.md
  - version: "2.8"
    date: "2026-10-06"
    summary: >-
      Phase 7 Smarthost side. Adds webhooks.delivery_contract (body, headers, signature input,
      receiver rules, at-least-once semantics, fan-out timing, webhook.test addressing, retry and
      permanent-failure rules, SSRF destination policy with address pinning and no redirects,
      limits, worker leases/fencing/heartbeats, dashboard management). Schema:
      webhook_deliveries.updated_at, last_attempt_at, last_response_excerpt and claim
      consistency checks; webhook.test always names exactly one endpoint (webhook_endpoint_id
      required; a database check ties webhook.test to the webhook_endpoint subject);
      webhook_worker_heartbeats and dashboard indexes; APP_RETENTION_WEBHOOK_DELIVERIES_DAYS (empty:
      no automatic deletion). Decisions: no public endpoint-management API, no suppression-lookup
      API, production APP_WEBHOOK_* values deferred to Phase 8. Environment: APP_WEBHOOK_ALLOWED_PRIVATE_HOSTS. The real
      first-client integration remains outstanding.
    decisions_incorporated: []
    decision_log: docs/architecture/open-decisions.md
  - version: "2.9"
    date: "2026-10-06"
    summary: >-
      Phase 8 repository-side production readiness. Adds podman_environment.production_topology
      (standalone persistent containers on an internal and an egress network instead of the
      development pod, the network matrix, published ports, host firewall, rootless notes) and
      production_operations (smarthostctl prod, the production configuration profile and safety
      rules, the capture/held/live/paused delivery states, the audited and preflight-gated
      activation, the SYSTEM.DELIVERY.CONTROL permission, the production preflight, DKIM key
      management, Postfix production rules incl. submission sender ownership, warm-up, emergency
      controls, delivery heartbeats, backups, upgrades, seed testing, rehearsal). Pacing adds the
      installation-wide DELIVERY_GLOBAL_RATE_PER_MINUTE and the throttled-client rate; webhooks
      add APP_WEBHOOK_CONNECT_TIMEOUT_SECONDS and a response-header bound; schema adds
      delivery_heartbeats; environment adds the deployment variables and the production profile.
      Networking closeout (owner instruction): production publishes no port; a systemd
      socket-activated ingress hands 443/25 to nginx, which passes SMTP to Postfix with the PROXY
      protocol over the new ingress network, so nginx/Symfony and Postfix see real client
      addresses (production_topology.ingress; SMARTHOST_INGRESS_SUBNET; TRUSTED_PROXIES empty in
      production); the low-port sysctl is a checked host prerequisite (preflight sections host and
      ingress, `prod ingress-check`); IPv4-only delivery, disabled validator SMTP probing and unset
      retention are recorded as launch decisions.
    decisions_incorporated: []
    decision_log: docs/architecture/open-decisions.md
  - version: "2.10"
    date: "2026-10-07"
    summary: >-
      Phase 9 repository-side public SaaS hardening. Adds saas_operations: the client lifecycle
      (pending_approval, active, throttled, suspended, closed) with per-transition permissions,
      reasons and audit; the disabled public-onboarding gate (APP_PUBLIC_ONBOARDING_ENABLED, no
      public route); service-policy acceptance by version; contact metadata and private notes;
      per-client limits with installation ceilings and concurrency-safe quota counters (429
      quota-exceeded); API-key names and expiry; usage period summaries, reconciliation,
      provider-neutral billing statements and export; per-client reputation metrics and
      threshold alerts without automatic action (production timer); webhook endpoint health; the
      public integration guide at /docs/api. Schema: client_limits, client_quota_usage,
      client_notes, client_policy_acceptances, billing_statements, billing_statement_lines,
      client_reputation_metrics, client_alerts, new clients and api_keys columns, one usage unit
      per message. OpenAPI 1.0.0-draft.8; status vocabulary 2.5.0.
    decisions_incorporated: []
    decision_log: docs/architecture/open-decisions.md
  - version: "2.11"
    date: "2026-10-07"
    summary: >-
      Operator self-service (owner instruction): operator_self_service and implementation phase 10.
      The one-command installer for Ubuntu Server 26.04 LTS from an exact release tag; the host
      agent (host-side checks and audited dashboard requests); the bootstrap sign-in link; the
      administrator setup wizard; diagnostics with history and the system health dashboard; the
      delivery modes and the web emergency stop (delivery_controls, read by the delivery daemon);
      Let's Encrypt DNS-01 automation; scheduled, encrypted, off-host backups and the restore
      rehearsal; log shortcuts; the help and tutorials; administrator address batches with the
      separate address state dimensions, staged sends and the re-permission page with
      repermission.responded; the ctnlist integration document. Schema: system_requests,
      system_checks, system_check_runs, system_state, setup_steps, delivery_controls,
      address_batches, address_batch_entries, address_batch_sends. OpenAPI 1.0.0-draft.9;
      status vocabulary 2.6.0. Production host target: Ubuntu Server 26.04 LTS.
    decisions_incorporated: []
    decision_log: docs/architecture/open-decisions.md
